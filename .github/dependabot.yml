# 액션을 커밋 SHA 로 고정(deploy.yml)하면 보안 패치를 자동으로 받지 못한다.
# Dependabot 이 주간으로 갱신 PR 을 올려 그 부작용을 해소한다.
# SHA 고정을 유지한 채로 업데이트되며, PR 본문에 릴리스 노트가 붙는다.
#
# npm 의존성(astro, vite 등)도 같은 방식으로 추적하려면 아래 주석 블록을 켠다.
# 지금은 PR 노이즈를 줄이려고 액션만 대상으로 둔다.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"

  # - package-ecosystem: "npm"
