<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" role="img"
     aria-label="AES-128 과 SAMPLE-AES 에서 데이터 흐름은 암호 계층에서 컨테이너 계층, 코덱 계층으로 똑같이 내려가지만 암호 계층이 알아야 하는 범위가 다르다. AES-128 에서는 그 범위가 암호 계층 하나에 그치고, SAMPLE-AES 에서는 컨테이너 계층과 코덱 계층까지 포함하도록 넓어진다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .box   { fill:#ffffff; stroke:#656d76 }
    .boxa  { fill:#ddf4ff; stroke:#0969da }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .warn  { stroke:#9a6700 }
    .warnf { fill:#9a6700 }
    .good  { stroke:#1a7f37 }
    .goodf { fill:#1a7f37 }
    .lead  { stroke:#656d76 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .box   { fill:#0d1117; stroke:#8b949e }
      .boxa  { fill:#123a63; stroke:#4493f8 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .warn  { stroke:#d29922 }
      .warnf { fill:#d29922 }
      .good  { stroke:#3fb950 }
      .goodf { fill:#3fb950 }
      .lead  { stroke:#8b949e }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="372" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">데이터 흐름은 같다. 다른 것은 암호 계층이 알아야 하는 범위다.</text>

  <rect class="panel" x="40"  y="62" width="390" height="252" rx="8" stroke-width="1"/>
  <rect class="panel" x="450" y="62" width="390" height="252" rx="8" stroke-width="1"/>

  <text class="acc" x="60"  y="86" font-size="13" font-weight="600">AES-128 — 계층이 분리된다</text>
  <text class="acc" x="470" y="86" font-size="13" font-weight="600">SAMPLE-AES — 계층이 얽힌다</text>

  <rect class="good" x="52"  y="96" width="366" height="66" rx="6" fill="none" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect class="warn" x="462" y="96" width="366" height="206" rx="6" fill="none" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="goodf" x="60"  y="176" font-size="11">암호 계층이 알아야 하는 범위</text>
  <text class="warnf" x="470" y="316" font-size="11">암호 계층이 알아야 하는 범위</text>

  <rect class="boxa" x="66"  y="106" width="338" height="46" rx="5" stroke-width="1.3"/>
  <rect class="boxa" x="476" y="106" width="338" height="46" rx="5" stroke-width="1.3"/>
  <text class="ink" x="235" y="128" font-size="13" text-anchor="middle">암호 계층</text>
  <text class="ink" x="645" y="128" font-size="13" text-anchor="middle">암호 계층</text>
  <text class="muted m" x="235" y="144" font-size="10.5" text-anchor="middle">decrypt.py — CBC 한 번</text>
  <text class="muted m" x="645" y="144" font-size="10.5" text-anchor="middle">샘플마다 부분 복호</text>

  <rect class="box" x="66"  y="196" width="338" height="46" rx="5" stroke-width="1.2"/>
  <rect class="box" x="476" y="196" width="338" height="46" rx="5" stroke-width="1.2"/>
  <text class="ink" x="235" y="218" font-size="13" text-anchor="middle">컨테이너 계층</text>
  <text class="ink" x="645" y="218" font-size="13" text-anchor="middle">컨테이너 계층</text>
  <text class="muted m" x="235" y="234" font-size="10.5" text-anchor="middle">TS · PES 파서</text>
  <text class="muted m" x="645" y="234" font-size="10.5" text-anchor="middle">TS · PES 파서</text>

  <rect class="box" x="66"  y="256" width="338" height="42" rx="5" stroke-width="1.2"/>
  <rect class="box" x="476" y="256" width="338" height="42" rx="5" stroke-width="1.2"/>
  <text class="ink" x="235" y="277" font-size="13" text-anchor="middle">코덱 계층</text>
  <text class="ink" x="645" y="277" font-size="13" text-anchor="middle">코덱 계층</text>
  <text class="muted m" x="235" y="292" font-size="10.5" text-anchor="middle">H.264 NAL · AAC</text>
  <text class="muted m" x="645" y="292" font-size="10.5" text-anchor="middle">H.264 NAL · AAC</text>

  <line class="lead" x1="235" y1="162" x2="235" y2="194" stroke-width="1.2" marker-end="url(#a26)"/>
  <line class="lead" x1="645" y1="162" x2="645" y2="194" stroke-width="1.2" marker-end="url(#a26)"/>
  <line class="lead" x1="235" y1="242" x2="235" y2="254" stroke-width="1.2" marker-end="url(#a26)"/>
  <line class="lead" x1="645" y1="242" x2="645" y2="254" stroke-width="1.2" marker-end="url(#a26)"/>
  <text class="muted" x="246" y="182" font-size="11">평문 바이트열을 넘긴다</text>
  <text class="muted" x="656" y="182" font-size="11">평문 바이트열을 넘긴다</text>

  <line class="lead" x1="44" y1="332" x2="836" y2="332" stroke-width="1"/>
  <text x="48" y="356" font-size="12.5" xml:space="preserve"><tspan class="goodf" font-weight="600">왼쪽</tspan><tspan class="ink"> — 암호 계층은 아래 두 계층의 존재를 모른다. 위임 경계가 얇아 </tspan><tspan class="m ink">decrypt.py</tspan><tspan class="ink"> 58줄로 끝난다.</tspan></text>
  <text x="48" y="378" font-size="12.5" xml:space="preserve"><tspan class="warnf" font-weight="600">오른쪽</tspan><tspan class="ink"> — 샘플 경계를 알려면 컨테이너를, 샘플 안의 암호 구간을 알려면 코덱을 파싱해야 한다.</tspan></text>
</svg>
