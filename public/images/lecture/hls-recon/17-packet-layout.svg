<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" role="img"
     aria-label="188바이트 패킷의 몸통 184바이트를 무엇이 차지하는지는 adaptation field control 2비트가 정한다. 01 은 payload 만, 10 은 adaptation field 만, 11 은 둘 다, 00 은 규격상 쓰이지 않는다. continuity counter 는 payload 가 있는 01 과 11 에서만 증가한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .hdr   { fill:#ddf4ff; stroke:#0969da }
    .pay   { fill:#f6f8fa; stroke:#d8dee6 }
    .adapt { fill:#eaeef2; stroke:#8c959f }
    .void  { fill:#ffffff; stroke:#cf222e }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .good  { fill:#1a7f37 }
    .bad   { fill:#cf222e }
    .rule  { stroke:#d8dee6 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .hdr   { fill:#123a63; stroke:#4493f8 }
      .pay   { fill:#161b22; stroke:#30363d }
      .adapt { fill:#21262d; stroke:#6e7681 }
      .void  { fill:#0d1117; stroke:#f85149 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .good  { fill:#3fb950 }
      .bad   { fill:#f85149 }
      .rule  { stroke:#30363d }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="320" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">188바이트 한 장 — 몸통 184바이트를 무엇이 차지하는지는 AFC 2비트가 정한다</text>

  <text class="muted" x="52"  y="78" font-size="11.5" font-weight="600">AFC</text>
  <text class="muted" x="150" y="78" font-size="11.5" font-weight="600">188바이트 배치</text>
  <text class="muted" x="706" y="78" font-size="11.5" font-weight="600">CC 는</text>

  <text class="ink m" x="52" y="110" font-size="13">01</text>
  <rect class="hdr" x="150" y="88"  width="62"  height="32" rx="3" stroke-width="1.2"/>
  <rect class="pay" x="212" y="88"  width="478" height="32" rx="3" stroke-width="1"/>
  <text class="acc"   x="181" y="109" font-size="10.5" text-anchor="middle">헤더</text>
  <text class="ink"   x="451" y="109" font-size="12.5" text-anchor="middle">payload 184바이트</text>
  <text class="good"  x="706" y="109" font-size="12.5" font-weight="600">증가</text>

  <text class="ink m" x="52" y="162" font-size="13">10</text>
  <rect class="hdr"   x="150" y="140" width="62"  height="32" rx="3" stroke-width="1.2"/>
  <rect class="adapt" x="212" y="140" width="478" height="32" rx="3" stroke-width="1"/>
  <text class="acc"   x="181" y="161" font-size="10.5" text-anchor="middle">헤더</text>
  <text class="ink"   x="451" y="161" font-size="12.5" text-anchor="middle">adaptation field 184바이트 (PCR·패딩·불연속 표시)</text>
  <text class="bad"   x="706" y="161" font-size="12.5" font-weight="600">유지</text>

  <text class="ink m" x="52" y="214" font-size="13">11</text>
  <rect class="hdr"   x="150" y="192" width="62"  height="32" rx="3" stroke-width="1.2"/>
  <rect class="adapt" x="212" y="192" width="190" height="32" rx="3" stroke-width="1"/>
  <rect class="pay"   x="402" y="192" width="288" height="32" rx="3" stroke-width="1"/>
  <text class="acc"   x="181" y="213" font-size="10.5" text-anchor="middle">헤더</text>
  <text class="ink"   x="307" y="213" font-size="12"   text-anchor="middle">adaptation field</text>
  <text class="ink"   x="546" y="213" font-size="12"   text-anchor="middle">payload</text>
  <text class="good"  x="706" y="213" font-size="12.5" font-weight="600">증가</text>

  <text class="ink m" x="52" y="266" font-size="13">00</text>
  <rect class="hdr"  x="150" y="244" width="62"  height="32" rx="3" stroke-width="1.2"/>
  <rect class="void" x="212" y="244" width="478" height="32" rx="3" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="acc"  x="181" y="265" font-size="10.5" text-anchor="middle">헤더</text>
  <text class="bad"  x="451" y="265" font-size="12.5" text-anchor="middle">규격상 쓰이지 않는다</text>
  <text class="muted" x="706" y="265" font-size="12.5">—</text>

  <line class="rule" x1="44" y1="290" x2="836" y2="290" stroke-width="1"/>
  <text x="44" y="314" font-size="13" xml:space="preserve"><tspan class="ink">코드는 AFC 2비트를 통째로 읽지 않고 payload 비트 하나만 본다 — </tspan><tspan class="acc m">pkt[3] &amp; 0x10</tspan><tspan class="ink"> 이 CC 증가 여부와 정확히 일치하기 때문이다.</tspan></text>
</svg>
