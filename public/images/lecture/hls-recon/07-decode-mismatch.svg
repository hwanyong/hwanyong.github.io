<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="이중 인코딩 우회의 구조. 요청이 도착한 시점, 검증기가 한 번 디코드한 시점, 파일 계층이 다시 디코드한 시점에서 같은 문자열이 서로 다르게 보인다. 검증기는 점 점 슬래시를 보지 못하고 통과시키지만 파일 계층은 그것을 본다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .warn  { fill:#9a6700 }
    .bad   { fill:#cf222e }
    .chip  { fill:#eaeef2 }
    .chipb { fill:#ffebe9 }
    .arw   { stroke:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .warn  { fill:#d29922 }
      .bad   { fill:#f85149 }
      .chip  { fill:#21262d }
      .chipb { fill:#3d1418 }
      .arw   { stroke:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="340" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="50" font-size="15" font-weight="600">이중 인코딩 우회 — 계층마다 누적 디코드 횟수가 다르다</text>
  <text class="muted" x="44" y="71" font-size="12">왼쪽 숫자는 그 계층에 도달했을 때까지 누적된 퍼센트 디코드 횟수다</text>

  <line class="arw" x1="72" y1="118" x2="72" y2="168" stroke-width="1.4"/>
  <line class="arw" x1="72" y1="196" x2="72" y2="246" stroke-width="1.4"/>

  <rect class="panel" x="96" y="84" width="728" height="66" rx="7"/>
  <circle class="chip" cx="72" cy="102" r="15"/>
  <text class="muted" x="72" y="107" font-size="13" text-anchor="middle" font-weight="600">0</text>
  <text class="ink" x="114" y="108" font-size="13.5" font-weight="600">① 요청이 도착한다 — 원문 그대로</text>
  <text class="ink m" x="114" y="134" font-size="13">GET /files/%252e%252e%252fetc/passwd</text>

  <rect class="panel" x="96" y="162" width="728" height="66" rx="7"/>
  <circle class="chip" cx="72" cy="182" r="15"/>
  <text class="muted" x="72" y="187" font-size="13" text-anchor="middle" font-weight="600">1</text>
  <text x="114" y="186" font-size="13.5" xml:space="preserve"><tspan class="ink" font-weight="600">② 검증기 — 디코드 1회 후 상위 이동 표기를 찾는다</tspan><tspan class="warn" font-weight="600">   판정: 통과</tspan></text>
  <text x="114" y="212" font-size="13" xml:space="preserve"><tspan class="ink m">/files/%2e%2e%2fetc/passwd</tspan><tspan class="muted">   찾는 문자열이 없다</tspan></text>

  <rect class="panel" x="96" y="240" width="728" height="66" rx="7"/>
  <circle class="chipb" cx="72" cy="260" r="15"/>
  <text class="bad" x="72" y="265" font-size="13" text-anchor="middle" font-weight="600">2</text>
  <text x="114" y="264" font-size="13.5" xml:space="preserve"><tspan class="ink" font-weight="600">③ 파일 계층 — 한 번 더 디코드된다</tspan><tspan class="bad" font-weight="600">   결과: 상위 디렉터리 도달</tspan></text>
  <text x="114" y="290" font-size="13" xml:space="preserve"><tspan class="bad m" font-weight="600">/files/../etc/passwd</tspan><tspan class="muted">   검증기가 본 적 없는 문자열이다</tspan></text>

  <line class="rule" x1="44" y1="322" x2="836" y2="322" stroke-width="1"/>
  <text x="44" y="345" font-size="13" xml:space="preserve"><tspan class="ink">취약점은 디코딩에 있지 않다. </tspan><tspan class="acc" font-weight="600">②와 ③의 횟수가 1 어긋난 것</tspan><tspan class="ink">에 있다 — 같은 원리의 부호만 뒤집은 것이 이 장의 정규화다.</tspan></text>
</svg>
