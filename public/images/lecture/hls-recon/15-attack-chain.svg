<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="CVE-2023-6602 공격 구조. 공격자가 플레이리스트 텍스트 한 장으로 세그먼트 URI 를 정하면, 그것을 여는 쪽에서 의도치 않은 demuxer 가 선택되어 파싱 버그나 DoS 증폭에 도달한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .danger{ fill:#ffebe9; stroke:#ff8182 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .warn  { fill:#9a6700 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .danger{ fill:#3d1518; stroke:#f85149 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .warn  { fill:#d29922 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="372" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">공격자가 통제하는 것은 플레이리스트 텍스트 한 장뿐이다</text>

  <rect class="box" x="240" y="56" width="400" height="82" rx="8" stroke-width="1"/>
  <text class="muted m" x="264" y="78" font-size="12">#EXTM3U</text>
  <text class="muted m" x="264" y="96" font-size="12">#EXTINF:6.0,</text>
  <text class="bad m" x="264" y="114" font-size="12.5" font-weight="600">payload.bin</text>
  <text class="muted" x="264" y="130" font-size="11">규격은 이 URI 가 무엇을 가리키든 막지 않는다</text>

  <line x1="440" y1="140" x2="440" y2="160" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="muted" x="452" y="155" font-size="11.5">피해자가 이 플레이리스트를 연다</text>

  <rect class="box" x="180" y="164" width="520" height="42" rx="8" stroke-width="1"/>
  <text class="ink" x="440" y="190" font-size="13" text-anchor="middle">ffmpeg 이 세그먼트를 열며 내용으로 포맷을 추정한다</text>

  <line x1="440" y1="208" x2="440" y2="228" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect class="danger" x="180" y="232" width="520" height="42" rx="8" stroke-width="1.5"/>
  <text x="440" y="258" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="bad" font-weight="600">의도치 않은 demuxer 가 선택된다</tspan><tspan class="muted"> — TTY · XBIN …</tspan></text>

  <path d="M400,276 L400,292 Q400,300 390,300 L250,300 Q240,300 240,308 L240,318" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M480,276 L480,292 Q480,300 490,300 L630,300 Q640,300 640,308 L640,318" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect class="box" x="60" y="322" width="360" height="46" rx="8" stroke-width="1"/>
  <text class="ink" x="240" y="342" font-size="12.5" text-anchor="middle">그 demuxer 의 파싱 버그에 도달</text>
  <text class="warn" x="240" y="360" font-size="12" text-anchor="middle" font-weight="600">메모리 안전성 문제</text>

  <rect class="box" x="460" y="322" width="360" height="46" rx="8" stroke-width="1"/>
  <text class="ink" x="640" y="342" font-size="12.5" text-anchor="middle">아주 작은 입력이 거대한 출력을 만든다</text>
  <text class="warn" x="640" y="360" font-size="12" text-anchor="middle" font-weight="600">DoS 증폭</text>
</svg>
