<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="스크램블된 TS 패킷에서 payload 는 암호문이지만 헤더 4바이트는 평문으로 남는다. 그래서 선두 바이트만 보는 매직 넘버 판별은 통과하고, 헤더의 scrambling control 2비트를 읽는 검사만이 미복호 상태를 잡아낸다.">
  <style>
    .bg     { fill:#ffffff; stroke:#d8dee6 }
    .hdr    { fill:#ddf4ff; stroke:#0969da }
    .cipher { fill:#fff8c5; stroke:#9a6700 }
    .cellw  { fill:#fff8c5; stroke:#9a6700 }
    .cell   { fill:#f6f8fa; stroke:#d8dee6 }
    .ink    { fill:#1f2328 }
    .muted  { fill:#656d76 }
    .acc    { fill:#0969da }
    .warn   { fill:#9a6700 }
    .bad    { fill:#cf222e }
    .good   { fill:#1a7f37 }
    .rule   { stroke:#d8dee6 }
    .lead   { stroke:#656d76 }
    .mk     { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg     { fill:#0d1117; stroke:#30363d }
      .hdr    { fill:#123a63; stroke:#4493f8 }
      .cipher { fill:#3d2e00; stroke:#d29922 }
      .cellw  { fill:#3d2e00; stroke:#d29922 }
      .cell   { fill:#161b22; stroke:#30363d }
      .ink    { fill:#e6edf3 }
      .muted  { fill:#8b949e }
      .acc    { fill:#4493f8 }
      .warn   { fill:#d29922 }
      .bad    { fill:#f85149 }
      .good   { fill:#3fb950 }
      .rule   { stroke:#30363d }
      .lead   { stroke:#8b949e }
      .mk     { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="340" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">스크램블된 패킷 — payload 는 암호문이지만 헤더 4바이트는 평문으로 남는다</text>

  <text x="48" y="80" font-size="12.5" xml:space="preserve"><tspan class="muted">매직 넘버 판별이 보는 두 바이트 — </tspan><tspan class="m muted">data[0]</tspan><tspan class="muted"> 과 </tspan><tspan class="m muted">data[188]</tspan><tspan class="muted">. 둘 다 평문이므로 그대로 통과한다.</tspan></text>
  <line class="lead" x1="61"  y1="92" x2="61"  y2="122" stroke-width="1.2" marker-end="url(#a17)"/>
  <line class="lead" x1="325" y1="92" x2="325" y2="122" stroke-width="1.2" marker-end="url(#a17)"/>

  <rect class="hdr"    x="48"  y="126" width="34"  height="42" rx="3" stroke-width="1.4"/>
  <rect class="cipher" x="82"  y="126" width="222" height="42" rx="3" stroke-width="1"/>
  <rect class="hdr"    x="312" y="126" width="34"  height="42" rx="3" stroke-width="1.4"/>
  <rect class="cipher" x="346" y="126" width="222" height="42" rx="3" stroke-width="1"/>
  <rect class="hdr"    x="576" y="126" width="34"  height="42" rx="3" stroke-width="1.4"/>
  <rect class="cipher" x="610" y="126" width="222" height="42" rx="3" stroke-width="1"/>

  <text class="acc m"  x="65"  y="152" font-size="10" text-anchor="middle">47</text>
  <text class="acc m"  x="329" y="152" font-size="10" text-anchor="middle">47</text>
  <text class="acc m"  x="593" y="152" font-size="10" text-anchor="middle">47</text>
  <text class="warn"   x="193" y="152" font-size="12.5" text-anchor="middle">payload 184바이트 — 암호문</text>
  <text class="warn"   x="457" y="152" font-size="12.5" text-anchor="middle">payload 184바이트 — 암호문</text>
  <text class="warn"   x="721" y="152" font-size="12.5" text-anchor="middle">payload 184바이트 — 암호문</text>
  <text class="muted"  x="48"  y="184" font-size="11">패킷 0</text>
  <text class="muted"  x="312" y="184" font-size="11">패킷 1</text>
  <text class="muted"  x="576" y="184" font-size="11">패킷 2</text>

  <line class="lead" x1="73.5" y1="170" x2="430" y2="216" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="lead" x1="82"   y1="170" x2="690" y2="216" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="muted m" x="96" y="182" font-size="10">pkt[3]</text>

  <rect class="cellw" x="430"   y="216" width="65"  height="30" rx="2" stroke-width="1.3"/>
  <rect class="cell"  x="495"   y="216" width="195" height="30" rx="2" stroke-width="1"/>
  <line class="rule" x1="462.5" y1="216" x2="462.5" y2="246" stroke-width="1"/>
  <line class="rule" x1="527.5" y1="216" x2="527.5" y2="246" stroke-width="1"/>
  <line class="rule" x1="560"   y1="216" x2="560"   y2="246" stroke-width="1"/>
  <line class="rule" x1="592.5" y1="216" x2="592.5" y2="246" stroke-width="1"/>
  <line class="rule" x1="625"   y1="216" x2="625"   y2="246" stroke-width="1"/>
  <line class="rule" x1="657.5" y1="216" x2="657.5" y2="246" stroke-width="1"/>
  <text class="warn m"  x="446.25" y="236" font-size="11" text-anchor="middle">1</text>
  <text class="warn m"  x="478.75" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="muted m" x="511.25" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="muted m" x="543.75" y="236" font-size="11" text-anchor="middle">1</text>
  <text class="muted m" x="576.25" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="muted m" x="608.75" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="muted m" x="641.25" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="muted m" x="673.75" y="236" font-size="11" text-anchor="middle">0</text>
  <text class="warn"    x="700" y="236" font-size="12" xml:space="preserve"><tspan class="warn m">(pkt[3] &gt;&gt; 6) &amp; 0x03</tspan></text>
  <text class="muted"   x="700" y="252" font-size="11">= 2, 0 이 아니다</text>

  <line class="rule" x1="44" y1="278" x2="836" y2="278" stroke-width="1"/>
  <text x="48" y="302" font-size="13" xml:space="preserve"><tspan class="bad" font-weight="600">선두 바이트만 보는 도구</tspan><tspan class="ink"> — 판정 </tspan><tspan class="m ink">mpegts</tspan><tspan class="ink">. 암호문을 영상으로 저장하고 수신 성공을 보고한다.</tspan></text>
  <text x="48" y="326" font-size="13" xml:space="preserve"><tspan class="good" font-weight="600">헤더 2비트를 읽는 도구</tspan><tspan class="ink"> — 판정 </tspan><tspan class="m ink">미복호 패킷</tspan><tspan class="ink">. 같은 바이트열에서 정반대 결론이 나온다.</tspan></text>
</svg>
