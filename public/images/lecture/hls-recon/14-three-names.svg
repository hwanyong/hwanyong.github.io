<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" role="img"
     aria-label="하나의 세그먼트 응답에서 자원의 정체를 말하는 세 층위. URI 확장자와 Content-Type 헤더는 서버의 자기 신고라 위조 가능하고, 페이로드 선두 바이트만 위조 불가다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .chip  { fill:#eaeef2 }
    .chipa { fill:#ddf4ff }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .chip  { fill:#21262d }
      .chipa { fill:#123a63 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="312" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="50" font-size="15" font-weight="600">하나의 세그먼트 응답 — 이 자원이 무엇인지 말하는 층은 셋이다</text>

  <rect class="panel" x="40" y="70" width="800" height="118" rx="8"/>
  <text class="muted" x="56" y="90" font-size="11.5" font-weight="600">서버가 정한다</text>

  <circle class="chip" cx="74" cy="118" r="14"/>
  <text class="muted" x="74" y="123" font-size="13" text-anchor="middle" font-weight="600">1</text>
  <text class="ink" x="100" y="123" font-size="14">URI 경로 확장자</text>
  <text class="muted m" x="266" y="123" font-size="13">…/1080p_010.html</text>
  <line class="rule" x1="440" y1="100" x2="440" y2="170" stroke-width="1"/>
  <text class="muted" x="460" y="118" font-size="12.5">자기 신고 값 — 어떤 규격도</text>
  <text class="muted" x="460" y="135" font-size="12.5">이것이 참임을 강제하지 않는다</text>

  <circle class="chip" cx="74" cy="163" r="14"/>
  <text class="muted" x="74" y="168" font-size="13" text-anchor="middle" font-weight="600">2</text>
  <text class="ink" x="100" y="168" font-size="14">Content-Type 응답 헤더</text>
  <text class="muted m" x="266" y="168" font-size="13">text/html</text>
  <text x="460" y="163" font-size="12.5" xml:space="preserve"><tspan class="bad" font-weight="600">위조 가능</tspan><tspan class="muted"> — 바꿔도 재생에 영향이 없다</tspan></text>

  <text class="acc" x="56" y="216" font-size="11.5" font-weight="600">데이터 자신이 정한다</text>
  <circle class="chipa" cx="74" cy="244" r="14"/>
  <text class="acc" x="74" y="249" font-size="13" text-anchor="middle" font-weight="600">3</text>
  <text class="ink" x="100" y="249" font-size="14" font-weight="600">페이로드 선두 바이트</text>
  <text class="acc m" x="266" y="249" font-size="13" font-weight="600">47 40 11 10</text>
  <line class="accs" x1="440" y1="228" x2="440" y2="262" stroke-width="1.5"/>
  <text x="460" y="244" font-size="12.5" xml:space="preserve"><tspan class="good" font-weight="600">위조 불가</tspan><tspan class="muted"> — 바꾸면 그 순간 재생이 안 된다</tspan></text>
  <text class="muted" x="460" y="261" font-size="11.5">0x47 = MPEG-TS 동기 바이트</text>

  <line class="rule" x1="44" y1="284" x2="836" y2="284" stroke-width="1"/>
  <text x="44" y="308" font-size="13" xml:space="preserve"><tspan class="ink">위장 송출은 </tspan><tspan class="bad" font-weight="600">①과 ②만</tspan><tspan class="ink"> 바꾸고 ③은 건드리지 못한다. 그것이 이 관행의 성립 조건이자, 받는 쪽이 쥔 </tspan><tspan class="acc" font-weight="600">유일한 지렛대</tspan><tspan class="ink">다.</tspan></text>
</svg>
