<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="한 번 계산한 오프셋을 두 경로가 나눠 쓴다. 영상 첫 세그먼트에서 얻은 video_pts0 와 자막 첫 조각의 X-TIMESTAMP-MAP 을 _subtitle_offsets 가 받아 트랙별 오프셋 표를 만들고, sidecar 경로는 shift 로 파일의 큐 시각을 다시 쓰고 내장 경로는 ffmpeg 의 -itsoffset 인자로 넘긴다. 실측에서 두 경로의 결과가 같았다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .chipa { fill:#ddf4ff; stroke:#0969da }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .good  { fill:#1a7f37 }
    .mk    { fill:#656d76 }
    .mka   { fill:#0969da }
    .ln    { stroke:#656d76 }
    .lna   { stroke:#0969da }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .chipa { fill:#123a63; stroke:#4493f8 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .good  { fill:#3fb950 }
      .mk    { fill:#8b949e }
      .mka   { fill:#4493f8 }
      .ln    { stroke:#8b949e }
      .lna   { stroke:#4493f8 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a27b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="a27c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mka"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="344" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">한 번 계산한 오프셋을 두 경로가 나눠 쓴다 — 중복 구현이 아니라 공유</text>

  <rect class="panel" x="44" y="70" width="182" height="62" rx="8" stroke-width="1"/>
  <text class="ink" x="58" y="92" font-size="13" font-weight="600">영상 첫 세그먼트</text>
  <text class="acc m" x="58" y="110" font-size="12">probe.first_pts</text>
  <text class="muted m" x="58" y="126" font-size="11.5">video_pts0 = 1.423s</text>

  <rect class="panel" x="44" y="152" width="182" height="62" rx="8" stroke-width="1"/>
  <text class="ink" x="58" y="174" font-size="13" font-weight="600">자막 첫 조각</text>
  <text class="acc m" x="58" y="192" font-size="12">X-TIMESTAMP-MAP</text>
  <text class="muted m" x="58" y="208" font-size="11.5">LOCAL · MPEGTS</text>

  <line class="ln" x1="226" y1="101" x2="264" y2="122" stroke-width="1.4" marker-end="url(#a27b)"/>
  <line class="ln" x1="226" y1="183" x2="264" y2="162" stroke-width="1.4" marker-end="url(#a27b)"/>

  <rect class="chipa" x="268" y="96" width="216" height="92" rx="8" stroke-width="1.2"/>
  <text class="acc m" x="282" y="118" font-size="12.5" font-weight="600">_subtitle_offsets</text>
  <text class="muted m" x="282" y="136" font-size="11.5">cli.py:237-289</text>
  <text class="ink m" x="282" y="156" font-size="11.5">mpegts/90000 − video_pts0</text>
  <text class="ink m" x="282" y="172" font-size="11.5">  − local_sec</text>

  <line class="lna" x1="484" y1="132" x2="528" y2="112" stroke-width="1.6" marker-end="url(#a27c)"/>
  <line class="lna" x1="484" y1="152" x2="528" y2="234" stroke-width="1.6" marker-end="url(#a27c)"/>
  <text class="muted m" x="272" y="210" font-size="11.5">→ {트랙 URI: 오프셋(초)}</text>

  <rect class="panel" x="532" y="70" width="304" height="82" rx="8" stroke-width="1"/>
  <text class="ink" x="548" y="92" font-size="13" font-weight="600">① sidecar 경로 — 파일을 고친다</text>
  <text class="acc m" x="548" y="112" font-size="12">subtitles.extract → shift()</text>
  <text class="muted m" x="548" y="132" font-size="11.5">00:00:05.000 → 00:01:05.000</text>

  <rect class="panel" x="532" y="196" width="304" height="82" rx="8" stroke-width="1"/>
  <text class="ink" x="548" y="218" font-size="13" font-weight="600">② 내장 경로 — ffmpeg 에 넘긴다</text>
  <text class="acc m" x="548" y="238" font-size="12">embed_args → -itsoffset</text>
  <text class="muted m" x="548" y="258" font-size="11.5">-itsoffset 60.000  -i sub.m3u8</text>

  <line class="rule" x1="44" y1="300" x2="836" y2="300" stroke-width="1"/>
  <text x="44" y="326" font-size="12.5" xml:space="preserve"><tspan class="ink">실측(ffmpeg 8.1.1) — 같은 스트림에서 두 경로 모두 첫 큐가 </tspan><tspan class="good" font-weight="600">60.0s</tspan><tspan class="ink"> 에 놓였다. 적용 방식이 달라도 결과가 같다.</tspan></text>
  <text class="muted" x="44" y="346" font-size="11.5">계산이 한 곳에만 있으므로, 식이 틀리면 두 경로가 함께 틀린다 — 한쪽만 조용히 어긋나는 일이 없다.</text>
</svg>
