<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img"
     aria-label="붙여넣은 쿠키 한 줄이 지나가는 네 지점. 셸 히스토리 파일, hls-recon 자신의 argv, ffmpeg 자식 프로세스의 argv, 리포트 JSON 순으로 사본이 남으며, 편집이 닿는 곳은 마지막 리포트 JSON 하나뿐이다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="548" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">붙여넣은 쿠키 한 줄이 지나가는 네 지점 — 지날 때마다 사본이 남는다</text>

  <rect class="panel" x="64" y="72" width="468" height="76" rx="8"/>
  <text class="ink" x="84" y="100" font-size="13.5" font-weight="600">① 셸 히스토리 파일</text>
  <text class="muted m" x="84" y="124" font-size="12">hls-recon URL --cookie &#39;sid=…; token=…&#39;</text>
  <text class="muted" x="560" y="102" font-size="12">읽는 쪽 — 같은 계정·백업·동기화</text>
  <text class="bad" x="560" y="122" font-size="11.5" font-weight="600">수명 — 영구(지우기 전까지)</text>

  <line class="rule" x1="120" y1="148" x2="120" y2="176" stroke-width="1.4" marker-end="url(#a12)"/>
  <text class="muted" x="140" y="168" font-size="12">셸이 이 줄을 실행한다</text>

  <rect class="panel" x="64" y="180" width="468" height="76" rx="8"/>
  <text class="ink" x="84" y="208" font-size="13.5" font-weight="600">② hls-recon 자신의 argv</text>
  <text class="muted m" x="84" y="232" font-size="12">--cookie &#39;sid=…; token=…&#39;</text>
  <text class="muted" x="560" y="210" font-size="12">읽는 쪽 — 같은 장비의 ps·pgrep</text>
  <text class="bad" x="560" y="230" font-size="11.5" font-weight="600">수명 — 프로세스가 사는 동안</text>

  <line class="rule" x1="120" y1="256" x2="120" y2="284" stroke-width="1.4" marker-end="url(#a12)"/>
  <text class="muted" x="140" y="276" font-size="12">probe.input_args() 가 -headers 로 위임한다</text>

  <rect class="panel" x="64" y="288" width="468" height="76" rx="8"/>
  <text class="ink" x="84" y="316" font-size="13.5" font-weight="600">③ ffmpeg·ffprobe 자식 프로세스의 argv</text>
  <text class="muted m" x="84" y="340" font-size="12">-headers &#39;Cookie: sid=…\r\n&#39;</text>
  <text class="muted" x="560" y="318" font-size="12">읽는 쪽 — 같은 장비의 ps·pgrep</text>
  <text class="bad" x="560" y="338" font-size="11.5" font-weight="600">수명 — 자식 실행마다 다시</text>

  <line class="rule" x1="120" y1="364" x2="120" y2="392" stroke-width="1.4" marker-end="url(#a12)"/>
  <text class="muted" x="140" y="384" font-size="12">report.build() 가 실행 명령을 기록한다</text>

  <rect class="accs" x="52" y="380" width="796" height="116" rx="10" fill="none" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect class="panel" x="64" y="396" width="468" height="76" rx="8"/>
  <text class="ink" x="84" y="424" font-size="13.5" font-weight="600">④ 리포트 JSON 의 mux_command</text>
  <text class="m" x="84" y="448" font-size="12" xml:space="preserve"><tspan class="muted">-headers &#39;Cookie: </tspan><tspan class="good" font-weight="600">***</tspan><tspan class="muted">\r\n&#39;</tspan></text>
  <text class="muted" x="560" y="426" font-size="12">읽는 쪽 — 아티팩트를 받는 누구나</text>
  <text class="good" x="560" y="446" font-size="11.5" font-weight="600">수명 — 파일이 지워질 때까지</text>
  <text class="acc" x="68" y="489" font-size="11.5" font-weight="600">편집(redaction)이 닿는 유일한 지점 — report.py:33-53</text>

  <line class="rule" x1="44" y1="520" x2="836" y2="520" stroke-width="1"/>
  <text x="44" y="544" font-size="13" xml:space="preserve"><tspan class="ink">네 지점 중 코드가 손댈 수 있는 곳은 </tspan><tspan class="acc" font-weight="600">④ 하나뿐</tspan><tspan class="ink">이다. </tspan><tspan class="bad" font-weight="600">①~③</tspan><tspan class="ink"> 은 편집으로 막히지 않으므로 운영 규칙으로 다뤄야 한다.</tspan></text>
</svg>
