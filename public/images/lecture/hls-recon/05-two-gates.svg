<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" role="img"
     aria-label="세그먼트 응답 한 건이 통과해야 하는 두 관문. 첫 관문은 전송 계층의 성공 여부를 묻고, 둘째 관문은 선두 바이트가 미디어인지를 묻는다. 두 관문의 실패는 리포트에서 서로 다른 항목으로 보고된다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .gate  { fill:#f6f8fa; stroke:#0969da }
    .fail  { fill:#f6f8fa; stroke:#cf222e }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .link  { stroke:#656d76 }
    .bads  { stroke:#cf222e }
    .mk    { fill:#656d76 }
    .mkb   { fill:#cf222e }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .gate  { fill:#161b22; stroke:#4493f8 }
      .fail  { fill:#161b22; stroke:#f85149 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .link  { stroke:#8b949e }
      .bads  { stroke:#f85149 }
      .mk    { fill:#8b949e }
      .mkb   { fill:#f85149 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkb"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="372" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="50" font-size="15" font-weight="600">세그먼트 응답 한 건이 지나는 두 관문 — 전송의 성공과 내용의 정당성은 따로 묻는다</text>

  <rect class="panel" x="40" y="136" width="132" height="64" rx="8"/>
  <text class="ink" x="54" y="162" font-size="13" font-weight="600">세그먼트 응답</text>
  <text class="muted m" x="54" y="182" font-size="12">HTTP 200 · 1.1MB</text>

  <line class="link" x1="172" y1="168" x2="200" y2="168" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="gate" x="206" y="128" width="182" height="80" rx="8" stroke-width="1.4"/>
  <text class="acc" x="220" y="150" font-size="11.5" font-weight="600">관문 ①</text>
  <text class="ink m" x="220" y="172" font-size="13.5" font-weight="600">res.ok</text>
  <text class="muted" x="220" y="192" font-size="12">전송이 성공했는가</text>

  <line class="link" x1="388" y1="168" x2="418" y2="168" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="good" x="396" y="160" font-size="11.5" font-weight="600">예</text>

  <rect class="gate" x="424" y="128" width="200" height="80" rx="8" stroke-width="1.4"/>
  <text class="acc" x="438" y="150" font-size="11.5" font-weight="600">관문 ②</text>
  <text class="ink m" x="438" y="172" font-size="13.5" font-weight="600">sniff(data)</text>
  <text class="muted" x="438" y="192" font-size="12">내용이 미디어인가</text>

  <line class="link" x1="624" y1="168" x2="654" y2="168" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="good" x="632" y="160" font-size="11.5" font-weight="600">예</text>

  <rect class="panel" x="660" y="136" width="180" height="64" rx="8"/>
  <text class="ink" x="674" y="162" font-size="13" font-weight="600">디스크 기록</text>
  <text class="muted" x="674" y="182" font-size="12.5">TS 무결성 분석으로</text>

  <line class="bads" x1="295" y1="208" x2="295" y2="246" stroke-width="1.4" marker-end="url(#ab)"/>
  <text class="bad" x="304" y="234" font-size="11.5" font-weight="600">아니오</text>
  <line class="bads" x1="524" y1="208" x2="524" y2="246" stroke-width="1.4" marker-end="url(#ab)"/>
  <text class="bad" x="533" y="234" font-size="11.5" font-weight="600">아니오</text>

  <rect class="fail" x="150" y="252" width="290" height="80" rx="8" stroke-width="1.4"/>
  <text class="bad" x="166" y="276" font-size="13" font-weight="600">리포트 항목 — 세그먼트 수신</text>
  <text class="muted" x="166" y="298" font-size="12">HTTP 4xx/5xx · 타임아웃 · 해제 실패</text>
  <text class="muted" x="166" y="318" font-size="12">전송 자체가 끊겼다</text>

  <rect class="fail" x="470" y="252" width="370" height="80" rx="8" stroke-width="1.4"/>
  <text class="bad" x="486" y="276" font-size="13" font-weight="600">리포트 항목 — 페이로드 유효성</text>
  <text class="muted" x="486" y="298" font-size="12">200 인데 선두 바이트가 미디어가 아니다</text>
  <text class="muted" x="486" y="318" font-size="12">전송은 성공했고, 엉뚱한 것이 배달됐다</text>

  <line class="rule" x1="44" y1="348" x2="836" y2="348" stroke-width="1"/>
  <text x="44" y="372" font-size="12.5" xml:space="preserve"><tspan class="ink">두 실패는 같은 사건이 아니다. 한쪽은 </tspan><tspan class="bad" font-weight="600">받지 못한 것</tspan><tspan class="ink">이고 다른 쪽은 </tspan><tspan class="bad" font-weight="600">받았는데 그것이 아닌 것</tspan><tspan class="ink">이다 — 그래서 항목을 나눈다.</tspan></text>
</svg>
