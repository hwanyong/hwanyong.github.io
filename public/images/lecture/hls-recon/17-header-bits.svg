  <text class="ink"   x="146"    y="148" font-size="12.5" text-anchor="middle">#1 sync byte</text>
  <text class="muted" x="256.25" y="148" font-size="12"   text-anchor="middle">#2</text>
  <text class="muted" x="280.75" y="148" font-size="12"   text-anchor="middle">#3</text>
