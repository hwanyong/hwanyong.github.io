  <text class="acc"   x="476.75" y="148" font-size="12.5" text-anchor="middle" font-weight="600">#5 PID · 13비트</text>
  <text class="warn"  x="660.5"  y="148" font-size="12"   text-anchor="middle" font-weight="600">#6</text>
  <text class="muted" x="709.5"  y="148" font-size="12"   text-anchor="middle">#7</text>
  <text class="ink"   x="783"    y="148" font-size="12.5" text-anchor="middle">#8 CC</text>

  <text x="52" y="196" font-size="12" xml:space="preserve"><tspan class="ink">#1 sync byte · 8b — </tspan><tspan class="muted m">pkt[0] == 0x47</tspan></text>
  <text x="52" y="221" font-size="12" xml:space="preserve"><tspan class="ink">#2 TEI · 1b — </tspan><tspan class="muted m">pkt[1] &amp; 0x80</tspan></text>
  <text x="52" y="246" font-size="12" xml:space="preserve"><tspan class="ink">#3 PUSI · 1b — </tspan><tspan class="muted m">pkt[1] &amp; 0x40</tspan></text>
  <text x="52" y="271" font-size="12" xml:space="preserve"><tspan class="ink">#4 transport priority · 1b — </tspan><tspan class="muted m">pkt[1] &amp; 0x20</tspan></text>

  <text x="452" y="196" font-size="12" xml:space="preserve"><tspan class="acc" font-weight="600">#5 PID · 13b — </tspan><tspan class="acc m">((pkt[1] &amp; 0x1F) &lt;&lt; 8) | pkt[2]</tspan></text>
  <text x="452" y="221" font-size="12" xml:space="preserve"><tspan class="warn" font-weight="600">#6 scrambling control · 2b — </tspan><tspan class="warn m">(pkt[3] &gt;&gt; 6) &amp; 0x03</tspan></text>
  <text x="452" y="246" font-size="12" xml:space="preserve"><tspan class="ink">#7 adaptation field control · 2b — </tspan><tspan class="muted m">(pkt[3] &gt;&gt; 4) &amp; 0x03</tspan></text>
  <text x="452" y="271" font-size="12" xml:space="preserve"><tspan class="ink">#8 continuity counter · 4b — </tspan><tspan class="muted m">pkt[3] &amp; 0x0F</tspan></text>

  <line class="rule" x1="44" y1="290" x2="836" y2="290" stroke-width="1"/>
  <text x="44" y="314" font-size="13" xml:space="preserve"><tspan class="ink">바이트 경계를 걸치는 필드는 </tspan><tspan class="acc" font-weight="600">#5 PID 하나뿐이다</tspan><tspan class="ink"> — 앞 바이트의 하위 5비트와 뒤 바이트 8비트를 이어야 13비트가 된다.</tspan></text>
