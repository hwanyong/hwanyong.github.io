<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" role="img"
     aria-label="MPEG-TS 패킷 헤더 4바이트를 32비트로 펼친 지도. sync byte 8비트, TEI·PUSI·transport priority 각 1비트, PID 13비트, transport scrambling control 2비트, adaptation field control 2비트, continuity counter 4비트. 바이트 경계를 걸치는 필드는 PID 하나뿐이다.">
  <style>
    .bg      { fill:#ffffff; stroke:#d8dee6 }
    .cell    { fill:#f6f8fa; stroke:#d8dee6 }
    .fld     { fill:#eaeef2; stroke:#d8dee6 }
    .fldacc  { fill:#ddf4ff; stroke:#0969da }
    .fldwarn { fill:#fff8c5; stroke:#9a6700 }
    .ink     { fill:#1f2328 }
    .muted   { fill:#656d76 }
    .acc     { fill:#0969da }
    .warn    { fill:#9a6700 }
    .rule    { stroke:#d8dee6 }
    .sep     { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg      { fill:#0d1117; stroke:#30363d }
      .cell    { fill:#161b22; stroke:#30363d }
      .fld     { fill:#21262d; stroke:#30363d }
      .fldacc  { fill:#123a63; stroke:#4493f8 }
      .fldwarn { fill:#3d2e00; stroke:#d29922 }
      .ink     { fill:#e6edf3 }
      .muted   { fill:#8b949e }
      .acc     { fill:#4493f8 }
      .warn    { fill:#d29922 }
      .rule    { stroke:#30363d }
      .sep     { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="324" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">헤더 4바이트 = 32비트 — 필드 경계는 바이트 경계와 일치하지 않는다</text>

