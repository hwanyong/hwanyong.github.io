<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" role="img"
     aria-label="4비트 카운터로는 유실 패킷 수 k 를 16으로 나눈 나머지만 관측된다. 나머지가 0이면 유실이 없었던 것과 구별되지 않고, 15이면 규격상 허용된 중복 패킷으로 오인된다. 따라서 16개 나머지 중 정확히 두 개가 검사를 빠져나간다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .cell  { fill:#eaeef2; stroke:#d8dee6 }
    .cella { fill:#ddf4ff; stroke:#0969da }
    .cellb { fill:#ffebe9; stroke:#cf222e }
    .cellg { fill:#dafbe1; stroke:#1a7f37 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .accs  { stroke:#0969da }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .warn  { fill:#9a6700 }
    .mk    { fill:#656d76 }
    .mka   { fill:#0969da }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .cell  { fill:#21262d; stroke:#30363d }
      .cella { fill:#123a63; stroke:#4493f8 }
      .cellb { fill:#4a1c1c; stroke:#f85149 }
      .cellg { fill:#12331d; stroke:#3fb950 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .accs  { stroke:#4493f8 }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .warn  { fill:#d29922 }
      .mk    { fill:#8b949e }
      .mka   { fill:#4493f8 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mka"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="312" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">유실 패킷 수 k 는 관측되지 않는다 — 관측되는 것은 k mod 16 뿐이다</text>
  <text class="ink m" x="44" y="80" font-size="13">직전 CC = p  ·  같은 PID 에서 k개 유실  ·  다음 관측 CC = (p + 1 + k) mod 16</text>
  <rect class="panel" x="40" y="96" width="800" height="62" rx="8" stroke-width="1"/>
  <text x="56" y="119" font-size="12.5" xml:space="preserve"><tspan class="bad" font-weight="600">빠져나감 ①</tspan><tspan class="ink"> — 관측 CC == 기대값  </tspan><tspan class="m ink">(cc == expected)</tspan><tspan class="ink">  ⟺  k ≡ 0 (mod 16)  →  유실이 없던 것과 구별 불가</tspan></text>
  <text x="56" y="143" font-size="12.5" xml:space="preserve"><tspan class="bad" font-weight="600">빠져나감 ②</tspan><tspan class="ink"> — 관측 CC == 직전값  </tspan><tspan class="m ink">(cc == prev)</tspan><tspan class="ink">  ⟺  k ≡ 15 (mod 16)  →  허용된 중복 패킷으로 오인</tspan></text>
  <text class="muted m" x="56" y="176" font-size="11.5">k mod 16</text>
  <rect class="cellb" x="56" y="186" width="48" height="40" stroke-width="1"/>
  <text class="bad m" x="80" y="212" font-size="14" text-anchor="middle" font-weight="600">0</text>
  <text class="bad" x="80" y="248" font-size="11.5" text-anchor="middle">미탐</text>
  <rect class="cellg" x="104" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="128" y="212" font-size="14" text-anchor="middle" font-weight="600">1</text>
  <text class="good" x="128" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="152" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="176" y="212" font-size="14" text-anchor="middle" font-weight="600">2</text>
  <text class="good" x="176" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="200" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="224" y="212" font-size="14" text-anchor="middle" font-weight="600">3</text>
  <text class="good" x="224" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="248" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="272" y="212" font-size="14" text-anchor="middle" font-weight="600">4</text>
  <text class="good" x="272" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="296" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="320" y="212" font-size="14" text-anchor="middle" font-weight="600">5</text>
  <text class="good" x="320" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="344" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="368" y="212" font-size="14" text-anchor="middle" font-weight="600">6</text>
  <text class="good" x="368" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="392" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="416" y="212" font-size="14" text-anchor="middle" font-weight="600">7</text>
  <text class="good" x="416" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="440" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="464" y="212" font-size="14" text-anchor="middle" font-weight="600">8</text>
  <text class="good" x="464" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="488" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="512" y="212" font-size="14" text-anchor="middle" font-weight="600">9</text>
  <text class="good" x="512" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="536" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="560" y="212" font-size="14" text-anchor="middle" font-weight="600">10</text>
  <text class="good" x="560" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="584" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="608" y="212" font-size="14" text-anchor="middle" font-weight="600">11</text>
  <text class="good" x="608" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="632" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="656" y="212" font-size="14" text-anchor="middle" font-weight="600">12</text>
  <text class="good" x="656" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="680" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="704" y="212" font-size="14" text-anchor="middle" font-weight="600">13</text>
  <text class="good" x="704" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellg" x="728" y="186" width="48" height="40" stroke-width="1"/>
  <text class="good m" x="752" y="212" font-size="14" text-anchor="middle" font-weight="600">14</text>
  <text class="good" x="752" y="248" font-size="11.5" text-anchor="middle">검출</text>
  <rect class="cellb" x="776" y="186" width="48" height="40" stroke-width="1"/>
  <text class="bad m" x="800" y="212" font-size="14" text-anchor="middle" font-weight="600">15</text>
  <text class="bad" x="800" y="248" font-size="11.5" text-anchor="middle">미탐</text>
  <line class="rule" x1="44" y1="272" x2="836" y2="272" stroke-width="1"/>
  <text x="44" y="300" font-size="13" xml:space="preserve"><tspan class="ink">16개 나머지 중 </tspan><tspan class="bad" font-weight="600">정확히 둘</tspan><tspan class="ink">이 빠져나간다 — 유실 길이가 균등 난수라면 미탐률 </tspan><tspan class="bad" font-weight="600">2/16 = 12.5%</tspan><tspan class="ink">.</tspan></text>
  <text class="muted" x="44" y="318" font-size="11.5">②는 규격이 허용한 중복 패킷을 오탐하지 않으려고 둔 예외다 — 오탐을 줄인 대가로 미탐이 두 배가 된다.</text>
</svg>
