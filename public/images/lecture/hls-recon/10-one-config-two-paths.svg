<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" role="img"
     aria-label="운영자가 정한 허용 사이트 값 하나가 두 경로로 갈라진다. 왼쪽은 요청의 Referer 를 대조하는 입력 검사로 403 을 만들고, 오른쪽은 상태 코드와 무관하게 붙는 Access-Control-Allow-Origin 출력 선언이다. 그 결과 한 건의 403 응답 안에 거절 사실과 그 거절을 통과하는 값이 함께 실린다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .cfg   { fill:#eaeef2; stroke:#d8dee6 }
    .resp  { fill:#ffebe9; stroke:#cf222e }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .warn  { fill:#9a6700 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .cfg   { fill:#21262d; stroke:#30363d }
      .resp  { fill:#3d1618; stroke:#f85149 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .warn  { fill:#d29922 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a10b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="430" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">구성값 하나가 검사와 선언을 동시에 낳는다 — 그래서 거부가 수용 조건을 서술한다</text>

  <rect class="cfg" x="300" y="66" width="280" height="54" rx="8" stroke-width="1"/>
  <text class="muted" x="440" y="88" font-size="11.5" text-anchor="middle">운영자가 정한 값 하나</text>
  <text class="acc m" x="440" y="108" font-size="13" text-anchor="middle" font-weight="600">https://site.example</text>

  <line class="rule" x1="380" y1="120" x2="230" y2="156" stroke-width="1.2" marker-end="url(#a10b)"/>
  <line class="rule" x1="500" y1="120" x2="650" y2="156" stroke-width="1.2" marker-end="url(#a10b)"/>
  <text class="muted" x="248" y="140" font-size="11.5" text-anchor="end">입력을 검사하는 데 쓴다</text>
  <text class="muted" x="632" y="140" font-size="11.5">출력에 선언하는 데 쓴다</text>

  <rect class="panel" x="44" y="164" width="356" height="122" rx="8" stroke-width="1"/>
  <text class="ink" x="64" y="188" font-size="13" font-weight="600">① 입력 검사 — 받아들일 조건</text>
  <text class="muted" x="64" y="212" font-size="12">요청의 Referer / Origin 이 그 값과 같은가</text>
  <text class="muted" x="64" y="234" font-size="12">다르거나 없으면 거절한다</text>
  <text class="bad m" x="64" y="262" font-size="13" font-weight="600">403 Forbidden</text>
  <text class="muted" x="64" y="278" font-size="11">이 판정은 비밀이어야 성립한다고 가정돼 있다</text>

  <rect class="panel" x="480" y="164" width="356" height="122" rx="8" stroke-width="1"/>
  <text class="ink" x="500" y="188" font-size="13" font-weight="600">② 출력 선언 — 응답에 붙이는 헤더</text>
  <text class="muted" x="500" y="212" font-size="12">브라우저 JS 에게 읽기를 허용한다는 공개 선언</text>
  <text class="muted" x="500" y="234" font-size="12">응답 헤더 규칙이라 상태 코드를 가리지 않는다</text>
  <text class="acc m" x="500" y="262" font-size="12" font-weight="600">Access-Control-Allow-Origin: https://…</text>
  <text class="muted" x="500" y="278" font-size="11">이 선언은 처음부터 공개가 목적이다</text>

  <line class="rule" x1="222" y1="286" x2="330" y2="322" stroke-width="1.2" marker-end="url(#a10b)"/>
  <line class="rule" x1="658" y1="286" x2="550" y2="322" stroke-width="1.2" marker-end="url(#a10b)"/>

  <rect class="resp" x="200" y="330" width="480" height="72" rx="8" stroke-width="1.5"/>
  <text class="ink" x="440" y="354" font-size="13" text-anchor="middle" font-weight="600">차단당한 403 응답 한 건</text>
  <text x="440" y="378" font-size="12.5" text-anchor="middle" xml:space="preserve"><tspan class="bad" font-weight="600">거절했다는 사실</tspan><tspan class="ink"> + </tspan><tspan class="acc" font-weight="600">그 거절을 통과하는 값</tspan><tspan class="ink"> 이 함께 실린다</tspan></text>
  <text class="muted" x="440" y="394" font-size="11" text-anchor="middle">요청 한 번으로 우회에 필요한 값이 전부 손에 들어온다</text>

  <line class="rule" x1="44" y1="414" x2="836" y2="414" stroke-width="1"/>
  <text x="44" y="436" font-size="13" xml:space="preserve"><tspan class="ink">공개가 목적인 선언과 비밀을 전제한 술어를 </tspan><tspan class="warn" font-weight="600">같은 구성값에 묶으면</tspan><tspan class="ink">, 남는 비밀은 없다.</tspan></text>
</svg>
