<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" role="img"
     aria-label="33비트 90kHz 클럭은 26시간 30분 43.72초마다 0 으로 되감긴다. 영상 첫 PTS 가 주기 N 의 끝 부근(95,440.0초)에 있고 자막 MPEGTS 가 되감김 직후(0.5초)에 있으면 실제 경과는 4.22초이지만, 두 값을 그대로 빼면 마이너스 95,439.5초가 나와 26.5시간 어긋난다. 모듈러 차분으로 되감김을 흡수해야 참값이 나온다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .band  { fill:#f6f8fa; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .good  { fill:#1a7f37 }
    .bad   { fill:#cf222e }
    .dot   { fill:#0969da }
    .ghost { fill:#ffffff; stroke:#cf222e }
    .rule  { stroke:#8c959f }
    .arwg  { stroke:#1a7f37 }
    .arwb  { stroke:#cf222e }
    .mkg   { fill:#1a7f37 }
    .mkb   { fill:#cf222e }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .band  { fill:#161b22; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .good  { fill:#3fb950 }
      .bad   { fill:#f85149 }
      .dot   { fill:#4493f8 }
      .ghost { fill:#0d1117; stroke:#f85149 }
      .rule  { stroke:#6e7681 }
      .arwg  { stroke:#3fb950 }
      .arwb  { stroke:#f85149 }
      .mkg   { fill:#3fb950 }
      .mkb   { fill:#f85149 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkg"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkb"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="294" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">33비트 클럭 위에서 뺄셈은 되감김을 보지 못한다</text>
  <text class="muted" x="44" y="66" font-size="12.5">시각은 축을 왼쪽에서 오른쪽으로 흐르다가 끝에서 0 으로 되돌아간다. 아래 두 점은 서로 다른 주기에 있다.</text>

  <text class="dot" x="424" y="100" font-size="12" text-anchor="end" font-weight="600">영상 첫 PTS 95,440.0s</text>
  <text class="dot" x="500" y="100" font-size="12" text-anchor="start" font-weight="600">자막 MPEGTS 0.5s</text>

  <rect class="band" x="60" y="128" width="400" height="34" rx="4" stroke-width="1"/>
  <rect class="band" x="462" y="128" width="358" height="34" rx="4" stroke-width="1"/>
  <line x1="461" y1="112" x2="461" y2="172" class="rule" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="muted" x="461" y="122" font-size="11.5" text-anchor="middle">되감김</text>

  <circle class="dot" cx="430" cy="145" r="5"/>
  <circle class="dot" cx="494" cy="145" r="5"/>
  <circle class="ghost" cx="63" cy="145" r="5" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="63" y1="152" x2="63" y2="244" class="arwb" stroke-width="1" stroke-dasharray="3 3"/>

  <text class="muted" x="260" y="182" font-size="11.5" text-anchor="middle">주기 N — 0 부터 2³³−1(= 95,443.72초)까지</text>
  <text class="muted" x="641" y="182" font-size="11.5" text-anchor="middle">주기 N+1 — 다시 0 부터</text>

  <line x1="430" y1="206" x2="494" y2="206" class="arwg" stroke-width="1.4" marker-end="url(#g)"/>
  <text class="good" x="462" y="226" font-size="12" text-anchor="middle" font-weight="600">실제 경과 +4.22초</text>

  <line x1="430" y1="250" x2="70" y2="250" class="arwb" stroke-width="1.4" marker-end="url(#b)"/>
  <text class="bad" x="250" y="270" font-size="12" text-anchor="middle" font-weight="600">뺄셈 결과 −95,439.5초 — 26.5시간 어긋난다</text>

  <text class="muted" x="44" y="296" font-size="12" xml:space="preserve"><tspan class="ink" font-weight="600">고치려면 뺄셈이 아니라 모듈러 차분이 필요하다.</tspan><tspan class="m"> ((a − b + 2³²) mod 2³³) − 2³²</tspan><tspan> 는 되감김을 흡수해 +4.22초를 되돌려준다.</tspan></text>
</svg>
