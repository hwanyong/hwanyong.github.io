  <text x="44" y="200" font-size="13" xml:space="preserve"><tspan class="ink">복원 = </tspan><tspan class="acc m">(3비트 &lt;&lt; 30) | (15비트 &lt;&lt; 15) | 15비트</tspan><tspan class="ink"> = </tspan><tspan class="good m" font-weight="600">128090 tick</tspan><tspan class="ink"> = </tspan><tspan class="good m" font-weight="600">1.423222 s</tspan></text>
  <text x="44" y="224" font-size="13" xml:space="preserve"><tspan class="warn" font-weight="600">M(marker_bit)</tspan><tspan class="ink"> 은 항상 1 이다. 15비트마다 1 이 강제되므로 이 5바이트 안의 최장 0 런은 15 로 묶인다.</tspan></text>
  <text x="44" y="246" font-size="13" xml:space="preserve"><tspan class="ink">start code 접두 </tspan><tspan class="acc m">00 00 01</tspan><tspan class="ink"> 은 0 이 23개 필요하므로 — </tspan><tspan class="good" font-weight="600">타임스탬프가 시작 코드를 흉내낼 수 없다.</tspan></text>
  <text class="muted" x="44" y="266" font-size="11.5">비어 보이는 이 한 비트가 파서의 동기 재획득을 지켜 준다.</text>
