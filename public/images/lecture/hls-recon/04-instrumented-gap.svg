<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" role="img"
     aria-label="세그먼트 다섯 건을 각각 HTTP GET 으로 받으면 요청마다 FetchResult 한 건이 값으로 남는다. HTTP 는 세로 방향의 요청 하나씩만 안다. 다섯 건을 가로질러 실패 수를 세는 검사는 프로토콜이 아니라 응용 코드가 직접 만든 것이다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .chip  { fill:#eaeef2 }
    .chipb { fill:#ffebe9 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .accs  { stroke:#0969da }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .chip  { fill:#21262d }
      .chipb { fill:#3d1618 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .accs  { stroke:#4493f8 }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="360" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">빈칸을 메우는 것은 프로토콜이 아니라 자료구조다</text>

  <text class="muted" x="56"  y="76" font-size="11.5" font-weight="600">세로 &#8212; HTTP 가 답하는 단위 (요청 하나)</text>
  <text class="muted" x="516" y="76" font-size="11.5" font-weight="600">가로 &#8212; 응용이 직접 세는 단위 (요청 전체)</text>

  <text class="m muted" x="56" y="108" font-size="12.5">seg000</text>
  <line class="rule" x1="126" y1="104" x2="244" y2="104" stroke-width="1.2" marker-end="url(#a)"/>
  <rect class="chip" x="256" y="91" width="184" height="26" rx="6"/>
  <text class="m good" x="268" y="108" font-size="12">ok=True   200   1.13MB</text>

  <text class="m muted" x="56" y="144" font-size="12.5">seg001</text>
  <line class="rule" x1="126" y1="140" x2="244" y2="140" stroke-width="1.2" marker-end="url(#a)"/>
  <rect class="chip" x="256" y="127" width="184" height="26" rx="6"/>
  <text class="m good" x="268" y="144" font-size="12">ok=True   200   1.09MB</text>

  <text class="m muted" x="56" y="180" font-size="12.5">seg002</text>
  <line class="rule" x1="126" y1="176" x2="244" y2="176" stroke-width="1.2" marker-end="url(#a)"/>
  <rect class="chipb" x="256" y="163" width="184" height="26" rx="6"/>
  <text class="m bad" x="268" y="180" font-size="12">ok=False  404   0 byte</text>

  <text class="m muted" x="56" y="216" font-size="12.5">seg003</text>
  <line class="rule" x1="126" y1="212" x2="244" y2="212" stroke-width="1.2" marker-end="url(#a)"/>
  <rect class="chip" x="256" y="199" width="184" height="26" rx="6"/>
  <text class="m good" x="268" y="216" font-size="12">ok=True   200   1.16MB</text>

  <text class="m muted" x="56" y="252" font-size="12.5">seg004</text>
  <line class="rule" x1="126" y1="248" x2="244" y2="248" stroke-width="1.2" marker-end="url(#a)"/>
  <rect class="chip" x="256" y="235" width="184" height="26" rx="6"/>
  <text class="m good" x="268" y="252" font-size="12">ok=True   200   1.11MB</text>

  <text class="muted" x="126" y="88" font-size="11">HTTP GET (각 행 1회)</text>
  <text class="muted" x="256" y="284" font-size="11">FetchResult 한 건 &#8212; 성공도 실패도 값으로 남는다</text>

  <path class="accs" d="M470,95 L462,95 L462,255 L470,255" fill="none" stroke-width="1.5"/>
  <path class="accs" d="M462,175 L492,175" fill="none" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="panel" x="500" y="91" width="336" height="170" rx="8"/>
  <text class="ink" x="516" y="115" font-size="13" font-weight="600">report.build 이 리스트를 가로지른다</text>
  <text class="m muted" x="516" y="140" font-size="11.5">failed = [f for f in fetches if not f.ok]</text>
  <text class="m bad" x="516" y="166" font-size="12.5" font-weight="600">1/5 실패 (HTTP [404])</text>
  <text class="m bad" x="516" y="188" font-size="12.5" font-weight="600">세그먼트 수신 &#8594; FAIL &#8594; exit 2</text>
  <line class="rule" x1="516" y1="206" x2="820" y2="206" stroke-width="1"/>
  <text class="muted" x="516" y="228" font-size="12">HTTP 은 세로 다섯 줄만 안다.</text>
  <text class="muted" x="516" y="248" font-size="12">가로줄은 어느 프로토콜도 그어 주지 않는다.</text>

  <line class="rule" x1="44" y1="308" x2="836" y2="308" stroke-width="1"/>
  <text x="44" y="332" font-size="12.5" xml:space="preserve"><tspan class="ink">요청 하나가 </tspan><tspan class="acc" font-weight="600">FetchResult 한 건</tspan><tspan class="ink">이 되고, 그 리스트를 가로질러 센다 &#8212; 이것이 이 코드가 메우는 빈칸이다.</tspan></text>
  <text x="44" y="354" font-size="12.5" xml:space="preserve"><tspan class="ink">실패를 </tspan><tspan class="bad" font-weight="600">예외로 던졌다면</tspan><tspan class="ink"> 실패한 요청은 리스트에 남지 않는다. 셀 대상 자체가 사라진다.</tspan></text>
</svg>
