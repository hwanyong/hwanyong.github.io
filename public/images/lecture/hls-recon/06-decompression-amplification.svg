<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="압축 해제 증폭 경로 그림. 적대적 서버가 보낸 995 KiB 의 gzip 본문이 resp.read 로 그대로 버퍼링된 뒤 _decompress 에서 1029배로 팽창해 1000 MiB 가 되고, 해제 버퍼 때문에 실제 메모리 최고치는 2110 MB 가 된다. 상한을 걸 수 있는 유일한 지점은 해제 호출 자체다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .badS  { stroke:#cf222e }
    .fan   { fill:#ffe3e3 }
    .hot   { fill:#ffebe9; stroke:#cf222e }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .badS  { stroke:#f85149 }
      .fan   { fill:#3d1618 }
      .hot   { fill:#25191b; stroke:#f85149 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="340" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">압축이 새로 만드는 것은 취약점이 아니라 증폭률이다</text>
  <text class="muted" x="44" y="70" font-size="12.5">이 저장소의 `_decompress` 를 그대로 호출해 실측한 값이다 (Python 3.14.5, macOS)</text>

  <rect class="panel" x="44" y="98" width="140" height="62" rx="8" stroke-width="1"/>
  <text class="ink" x="114" y="124" font-size="13" text-anchor="middle" font-weight="600">적대적 서버</text>
  <text class="muted m" x="114" y="143" font-size="11" text-anchor="middle">Content-Encoding: gzip</text>

  <line class="rule" x1="188" y1="129" x2="266" y2="129" stroke-width="1.4" marker-end="url(#a6)"/>
  <text class="muted m" x="227" y="118" font-size="11" text-anchor="middle">995 KiB</text>
  <text class="muted" x="227" y="150" font-size="11" text-anchor="middle">회선</text>

  <rect class="panel" x="272" y="98" width="176" height="62" rx="8" stroke-width="1"/>
  <text class="ink m" x="360" y="122" font-size="12.5" text-anchor="middle">raw = resp.read()</text>
  <text class="muted" x="360" y="142" font-size="11" text-anchor="middle">fetch.py:172 — 상한 없음</text>

  <polygon class="fan" points="452,120 596,74 596,186 452,140"/>
  <rect class="hot" x="596" y="74" width="240" height="112" rx="8" stroke-width="1.4"/>
  <text class="bad m" x="716" y="104" font-size="13" text-anchor="middle" font-weight="600">body — 1,000 MiB</text>
  <text class="muted" x="716" y="126" font-size="11.5" text-anchor="middle">해제 1.01 s · 피크 RSS 2,110 MB</text>
  <text class="muted" x="716" y="146" font-size="11.5" text-anchor="middle">해제 버퍼가 결과의 약 2배를 쓴다</text>
  <text class="muted" x="716" y="168" font-size="11.5" text-anchor="middle">이후 sniff·파싱은 이미 늦었다</text>

  <text class="bad" x="524" y="212" font-size="12.5" text-anchor="middle" font-weight="600">×1,029</text>

  <rect class="panel" x="452" y="230" width="144" height="34" rx="6" stroke-width="1"/>
  <text class="acc m" x="524" y="252" font-size="12" text-anchor="middle" font-weight="600">_decompress()</text>
  <line class="badS" x1="524" y1="228" x2="524" y2="196" stroke-width="1.4" marker-end="url(#a6)"/>
  <text class="muted" x="608" y="252" font-size="11.5">fetch.py:57-70 — 상한을 걸 수 있는 유일한 지점</text>

  <line class="rule" x1="44" y1="286" x2="836" y2="286" stroke-width="1"/>
  <text x="44" y="310" font-size="12.5" xml:space="preserve"><tspan class="ink">공격자가 실제로 보내는 양은 </tspan><tspan class="bad" font-weight="600">1/1029</tspan><tspan class="ink"> 이다. 무제한 버퍼링은 압축 없이도 이미 있었고, 압축은 그 비용만 1,029배로 깎는다.</tspan></text>
  <text x="44" y="332" font-size="12.5" xml:space="preserve"><tspan class="muted">해제 후 크기는 미리 알 수 없다 — </tspan><tspan class="ink m">Content-Length</tspan><tspan class="muted"> 는 압축된 크기이고, gzip 트레일러의 ISIZE 는 공격자가 쓴 값이다.</tspan></text>
</svg>
