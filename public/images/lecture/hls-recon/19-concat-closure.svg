<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" role="img"
     aria-label="연결에 대한 닫힘. 유효한 MPEG-TS 세그먼트 둘을 바이트로 이어붙이면 다시 유효한 TS 다. 각 칸은 선두에 동기 바이트 0x47 을 가진 188바이트 패킷이고, 이음매가 패킷 경계에 정확히 놓여 디코더가 그 자리에서 다음 0x47 을 만난다.">
  <defs>
    <marker id="c19a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .good  { fill:#1a7f37 }
    .chip  { fill:#eaeef2 }
    .chipa { fill:#ddf4ff }
    .on    { fill:#ffffff }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .good  { fill:#3fb950 }
      .chip  { fill:#21262d }
      .chipa { fill:#123a63 }
      .on    { fill:#ffffff }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="290" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">연결에 대한 닫힘 — 유효한 TS 둘을 이어붙이면 다시 유효한 TS 다</text>
  <text class="muted" x="44" y="66" font-size="11.5">각 칸 = 188바이트 패킷 · 선두 파랑 = 동기 바이트 0x47</text>

  <!-- 소스 행: A ++ B -->
  <text class="muted" x="200" y="88" font-size="12">세그먼트 A · 유효한 TS</text>
  <text class="muted" x="482" y="88" font-size="12">세그먼트 B · 유효한 TS</text>

  <!-- A: 3 packets -->
  <rect class="chip rule" x="200" y="94" width="78" height="40" stroke-width="1"/>
  <rect class="acc" x="200" y="94" width="15" height="40"/>
  <text class="on m" x="207.5" y="118" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="248" y="118" font-size="10" text-anchor="middle">188B</text>
  <rect class="chip rule" x="278" y="94" width="78" height="40" stroke-width="1"/>
  <rect class="acc" x="278" y="94" width="15" height="40"/>
  <text class="on m" x="285.5" y="118" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="326" y="118" font-size="10" text-anchor="middle">188B</text>
  <rect class="chip rule" x="356" y="94" width="78" height="40" stroke-width="1"/>
  <rect class="acc" x="356" y="94" width="15" height="40"/>
  <text class="on m" x="363.5" y="118" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="404" y="118" font-size="10" text-anchor="middle">188B</text>

  <text class="ink" x="455" y="120" font-size="17" font-weight="700" text-anchor="middle">+</text>

  <!-- B: 2 packets -->
  <rect class="chipa rule" x="482" y="94" width="78" height="40" stroke-width="1"/>
  <rect class="acc" x="482" y="94" width="15" height="40"/>
  <text class="on m" x="489.5" y="118" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="530" y="118" font-size="10" text-anchor="middle">188B</text>
  <rect class="chipa rule" x="560" y="94" width="78" height="40" stroke-width="1"/>
  <rect class="acc" x="560" y="94" width="15" height="40"/>
  <text class="on m" x="567.5" y="118" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="608" y="118" font-size="10" text-anchor="middle">188B</text>

  <!-- 연결 화살표 -->
  <line class="accs" x1="419" y1="148" x2="419" y2="186" stroke-width="1.5" marker-end="url(#c19a)"/>
  <text class="acc" x="434" y="172" font-size="12" font-weight="600">바이트 연결 (++)</text>

  <!-- 결과 행 -->
  <text class="muted" x="200" y="190" font-size="12">A ++ B</text>
  <text class="good" x="612" y="222" font-size="13" font-weight="600">= 다시 유효한 TS</text>

  <!-- 결과: A 3 + B 2 -->
  <rect class="chip rule" x="200" y="196" width="78" height="44" stroke-width="1"/>
  <rect class="acc" x="200" y="196" width="15" height="44"/>
  <text class="on m" x="207.5" y="222" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="248" y="222" font-size="10" text-anchor="middle">188B</text>
  <rect class="chip rule" x="278" y="196" width="78" height="44" stroke-width="1"/>
  <rect class="acc" x="278" y="196" width="15" height="44"/>
  <text class="on m" x="285.5" y="222" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="326" y="222" font-size="10" text-anchor="middle">188B</text>
  <rect class="chip rule" x="356" y="196" width="78" height="44" stroke-width="1"/>
  <rect class="acc" x="356" y="196" width="15" height="44"/>
  <text class="on m" x="363.5" y="222" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="404" y="222" font-size="10" text-anchor="middle">188B</text>
  <rect class="chipa rule" x="434" y="196" width="78" height="44" stroke-width="1"/>
  <rect class="acc" x="434" y="196" width="15" height="44"/>
  <text class="on m" x="441.5" y="222" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="482" y="222" font-size="10" text-anchor="middle">188B</text>
  <rect class="chipa rule" x="512" y="196" width="78" height="44" stroke-width="1"/>
  <rect class="acc" x="512" y="196" width="15" height="44"/>
  <text class="on m" x="519.5" y="222" font-size="9.5" text-anchor="middle">47</text>
  <text class="muted m" x="560" y="222" font-size="10" text-anchor="middle">188B</text>

  <!-- 이음매 -->
  <line class="accs" x1="434" y1="188" x2="434" y2="256" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="acc" x="434" y="270" font-size="11.5" font-weight="600" text-anchor="middle">이음매 = 패킷 경계 · 다음 0x47 이 정확히 여기 온다</text>

  <text class="muted" x="44" y="296" font-size="11.5">전역 헤더가 없어 연결이 위반할 불변식이 없다 — 그래서 유효한 TS 집합은 연결에 대해 닫혀 있다.</text>
</svg>
