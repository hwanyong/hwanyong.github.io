<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" role="img"
     aria-label="HLS AES-128 의 키 배포 경계. 송출 서버는 세그먼트 암호문과 평문 16바이트 키를 함께 내려주며, 접근 통제 경계 바깥의 적대자 A(세그먼트 URL 만 주운 제3자)는 키 요청이 차단되어 배제되지만, 정당하게 재생할 수 있는 적대자 B 는 키를 정상 수령하므로 배제되지 않는다.">
  <style>
    .bg     { fill:#ffffff; stroke:#d8dee6 }
    .panel  { fill:#f6f8fa; stroke:#d8dee6 }
    .box    { fill:#ffffff; stroke:#d8dee6 }
    .keybox { fill:#fff8c5; stroke:#d4a72c }
    .boxbad { fill:#ffebe9; stroke:#ff8182 }
    .note   { fill:#f6f8fa; stroke:#d8dee6 }
    .ink    { fill:#1f2328 }
    .muted  { fill:#656d76 }
    .good   { fill:#1a7f37 }
    .bad    { fill:#cf222e }
    .arw    { stroke:#8c959f }
    .arwb   { stroke:#cf222e }
    .dash   { stroke:#8c959f }
    .mk     { fill:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg     { fill:#0d1117; stroke:#30363d }
      .panel  { fill:#161b22; stroke:#30363d }
      .box    { fill:#0d1117; stroke:#30363d }
      .keybox { fill:#3b2300; stroke:#d29922 }
      .boxbad { fill:#3d1518; stroke:#f85149 }
      .note   { fill:#161b22; stroke:#30363d }
      .ink    { fill:#e6edf3 }
      .muted  { fill:#8b949e }
      .good   { fill:#3fb950 }
      .bad    { fill:#f85149 }
      .arw    { stroke:#6e7681 }
      .arwb   { stroke:#f85149 }
      .dash   { stroke:#6e7681 }
      .mk     { fill:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="338" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">키 배포 경계 — 무엇이 배제되고 무엇이 배제되지 않는가</text>

  <text class="muted" x="344" y="62" font-size="11.5" text-anchor="middle">접근 통제 경계</text>
  <line x1="344" y1="70" x2="344" y2="278" class="dash" stroke-width="1.4" stroke-dasharray="5 4"/>

  <rect class="panel" x="48" y="84" width="212" height="170" rx="8" stroke-width="1"/>
  <text class="ink" x="154" y="108" font-size="13.5" text-anchor="middle" font-weight="600">송출 서버</text>

  <rect class="box" x="64" y="120" width="180" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="154" y="140" font-size="12.5" text-anchor="middle">세그먼트 (암호문)</text>
  <text class="muted" x="154" y="158" font-size="11" text-anchor="middle">AES-128-CBC</text>

  <rect class="keybox" x="64" y="180" width="180" height="58" rx="6" stroke-width="1.4"/>
  <text class="ink" x="154" y="202" font-size="12.5" text-anchor="middle">키 URI</text>
  <text class="muted" x="154" y="222" font-size="11" text-anchor="middle">평문 16바이트를 반환</text>

  <text class="muted m" x="154" y="272" font-size="11.5" text-anchor="middle">KEYFORMAT=identity</text>

  <path d="M260,208 L316,208" class="arw" fill="none" stroke-width="1.4"/>
  <text class="muted" x="288" y="200" font-size="11" text-anchor="middle">키 요청</text>

  <path d="M316,208 L316,128 L334,128" class="arwb" fill="none" stroke-width="1.6"/>
  <path d="M338,122 L350,134 M350,122 L338,134" class="arwb" fill="none" stroke-width="2"/>
  <text class="bad" x="344" y="110" font-size="11" text-anchor="middle" font-weight="600">차단</text>

  <path d="M316,208 L316,226 L366,226" class="arw" fill="none" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="muted" x="350" y="218" font-size="11" text-anchor="middle">통과</text>

  <rect class="panel" x="372" y="96" width="460" height="64" rx="8" stroke-width="1"/>
  <text class="ink" x="392" y="122" font-size="12.5" font-weight="600">적대자 A — 세그먼트 URL 만 주운 제3자</text>
  <text class="muted" x="392" y="144" font-size="12">키를 얻지 못한다 → 암호문은 무의미한 바이트열</text>
  <text class="good" x="812" y="130" font-size="13" text-anchor="end" font-weight="600">배제됨</text>

  <rect class="boxbad" x="372" y="192" width="460" height="64" rx="8" stroke-width="1.4"/>
  <text class="ink" x="392" y="218" font-size="12.5" font-weight="600">적대자 B — 정당하게 재생할 수 있는 사용자</text>
  <text class="muted" x="392" y="240" font-size="12">키를 정상 수령한다 → 복호화 가능</text>
  <text class="bad" x="812" y="226" font-size="13" text-anchor="end" font-weight="600">배제 안 됨</text>

  <rect class="note" x="48" y="286" width="784" height="48" rx="8" stroke-width="1"/>
  <text class="ink" x="68" y="306" font-size="12.5" font-weight="600">재생할 수 있는 클라이언트는 정의상 키를 얻을 수 있다</text>
  <text class="muted" x="68" y="326" font-size="12">적대자 B 를 배제하는 구성은 존재하지 않는다 — 링크 보호는 성립하고 콘텐츠 보호는 성립하지 않는다</text>
</svg>
