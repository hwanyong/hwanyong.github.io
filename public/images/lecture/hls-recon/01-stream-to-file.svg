<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" role="img"
     aria-label="스트림에서 파일로 변환할 때 무엇이 사라지는가. 왼쪽은 다섯 번의 수신 사건으로 이루어진 스트림이고 각 수신마다 상태 코드·지연·해시가 남는다. 오른쪽은 하나의 파일이며 크기와 총 길이만 남고 어떻게 만들어졌는지는 기록되지 않는다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .chip  { fill:#eaeef2; stroke:#d8dee6 }
    .chipa { fill:#ddf4ff; stroke:#0969da }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .chip  { fill:#21262d; stroke:#30363d }
      .chipa { fill:#123a63; stroke:#4493f8 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="302" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">같은 30초 영상, 두 개의 존재 방식</text>

  <rect class="panel" x="40" y="68" width="330" height="172" rx="8"/>
  <text class="muted" x="56" y="90" font-size="11.5" font-weight="600">스트림 — 사건의 열 (n = 5)</text>

  <rect class="chipa" x="56"  y="102" width="54" height="28" rx="4" stroke-width="1"/>
  <rect class="chipa" x="117" y="102" width="54" height="28" rx="4" stroke-width="1"/>
  <rect class="chipa" x="178" y="102" width="54" height="28" rx="4" stroke-width="1"/>
  <rect class="chipa" x="239" y="102" width="54" height="28" rx="4" stroke-width="1"/>
  <rect class="chipa" x="300" y="102" width="54" height="28" rx="4" stroke-width="1"/>
  <text class="acc m" x="83"  y="120" font-size="10.5" text-anchor="middle">seg000</text>
  <text class="acc m" x="144" y="120" font-size="10.5" text-anchor="middle">seg001</text>
  <text class="acc m" x="205" y="120" font-size="10.5" text-anchor="middle">seg002</text>
  <text class="acc m" x="266" y="120" font-size="10.5" text-anchor="middle">seg003</text>
  <text class="acc m" x="327" y="120" font-size="10.5" text-anchor="middle">seg004</text>

  <text class="muted" x="56" y="153" font-size="11.5" font-weight="600">수신마다 관측되는 사실</text>
  <text class="ink" x="56" y="175" font-size="12.5">· HTTP 상태 — 200 · 404 · 403</text>
  <text class="ink" x="56" y="194" font-size="12.5">· TTFB · 처리량 · 재시도 횟수</text>
  <text class="ink" x="56" y="213" font-size="12.5">· 선두 바이트 · SHA-256 · 바이트 수</text>
  <text class="ink" x="56" y="232" font-size="12.5">· 도착 순서와 도착 시각</text>

  <line class="rule" x1="384" y1="154" x2="486" y2="154" stroke-width="1.5" marker-end="url(#a1)"/>
  <text class="ink" x="435" y="140" font-size="13" text-anchor="middle">연결 · 먹싱</text>
  <text class="muted m" x="435" y="174" font-size="11.5" text-anchor="middle">-c copy</text>

  <rect class="panel" x="500" y="68" width="340" height="172" rx="8"/>
  <text class="muted" x="516" y="90" font-size="11.5" font-weight="600">파일 — 상태 하나 (n = 1)</text>

  <rect class="chip" x="516" y="102" width="308" height="28" rx="4" stroke-width="1"/>
  <text class="ink m" x="670" y="120" font-size="11.5" text-anchor="middle">out.mp4   30.02s   6.3 MB</text>

  <text class="muted" x="516" y="153" font-size="11.5" font-weight="600">파일에서 관측되는 사실</text>
  <text class="ink" x="516" y="175" font-size="12.5">· 크기 · 수정 시각 · 컨테이너 종류</text>
  <text class="ink" x="516" y="194" font-size="12.5">· 총 재생 길이 · 코덱 · 해상도</text>
  <text class="ink" x="516" y="213" font-size="12.5">· 내부 구조가 스스로 말하는 것</text>
  <text x="516" y="232" font-size="12.5" xml:space="preserve"><tspan class="bad">· 어떻게 만들어졌는지 — </tspan><tspan class="bad" font-weight="600">없음</tspan></text>

  <line class="rule" x1="44" y1="264" x2="836" y2="264" stroke-width="1"/>
  <text x="44" y="286" font-size="13" xml:space="preserve"><tspan class="ink">수신 사건은 </tspan><tspan class="acc" font-weight="600">변환 지점에서만</tspan><tspan class="ink"> 관측된다. 파일이 된 뒤에는 복원되지 않는다.</tspan></text>
  <text x="44" y="305" font-size="13" xml:space="preserve"><tspan class="ink">재조립은 바이트만 있으면 되지만, 검증은 </tspan><tspan class="bad" font-weight="600">이미 사라진 사건</tspan><tspan class="ink">까지 필요로 한다.</tspan></text>
</svg>
