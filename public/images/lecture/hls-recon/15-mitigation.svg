<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" role="img"
     aria-label="확장자 allowlist 는 취약점을 고치지 않고 도달 경로를 좁힌다. 방어가 없으면 플레이리스트에서 수백 종 demuxer 에 도달할 수 있지만, allowlist 가 있으면 허용된 포맷에만 도달한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .danger{ fill:#ffebe9; stroke:#ff8182 }
    .safe  { fill:#dafbe1; stroke:#4ac26b }
    .off   { fill:#eaeef2 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .danger{ fill:#3d1518; stroke:#f85149 }
      .safe  { fill:#12341f; stroke:#3fb950 }
      .off   { fill:#21262d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="260" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">allowlist 는 취약점을 고치지 않는다 — 도달 경로를 좁힌다</text>

  <text class="bad" x="234" y="74" font-size="13" text-anchor="middle" font-weight="600">방어 없음</text>
  <text class="good" x="648" y="74" font-size="13" text-anchor="middle" font-weight="600">방어 있음</text>

  <rect class="box" x="140" y="88" width="188" height="34" rx="6" stroke-width="1"/>
  <text class="ink" x="234" y="110" font-size="12.5" text-anchor="middle">플레이리스트</text>
  <rect class="box" x="554" y="88" width="188" height="34" rx="6" stroke-width="1"/>
  <text class="ink" x="648" y="110" font-size="12.5" text-anchor="middle">플레이리스트</text>

  <line x1="234" y1="124" x2="234" y2="146" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="648" y1="124" x2="648" y2="146" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="muted" x="662" y="141" font-size="11">allowlist</text>

  <rect class="danger" x="80" y="150" width="308" height="44" rx="8" stroke-width="1.5"/>
  <text class="bad" x="234" y="177" font-size="12.5" text-anchor="middle" font-weight="600">수백 종 demuxer 에 도달 가능</text>

  <rect class="safe" x="494" y="150" width="308" height="44" rx="8" stroke-width="1.5"/>
  <text class="good" x="648" y="177" font-size="12.5" text-anchor="middle" font-weight="600">허용 목록 안의 포맷에만 도달</text>

  <rect class="off" x="494" y="204" width="308" height="30" rx="6"/>
  <text class="muted" x="648" y="224" font-size="12" text-anchor="middle">TTY · XBIN 등은 도달 자체가 불가</text>

  <text class="muted" x="44" y="256" font-size="12.5" xml:space="preserve"><tspan class="ink" font-weight="600">취약점 수정과 도달 경로 축소는 다른 층위의 대응이다.</tspan><tspan> 수백 개 demuxer 를 전부 감사하는 것보다 관문 하나를 좁히는 편이 빠르므로, 실무에서는 후자가 먼저 배포된다.</tspan></text>
</svg>
