<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" role="img"
     aria-label="PKCS#7 패딩에서 마지막 16바이트 블록의 세 가지 모양. 평문이 블록을 12바이트만 채우면 나머지 4바이트를 값 04 로 채우고, 평문이 블록 경계에서 정확히 끝나면 값 16(0x10)으로만 이루어진 블록을 하나 더 붙이며, 실측한 TS 세그먼트에서는 평문 4바이트 뒤에 값 0c 가 12바이트 붙었다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .cell  { fill:#f6f8fa; stroke:#d8dee6 }
    .padc  { fill:#fff8c5; stroke:#d4a72c }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .warn  { fill:#9a6700 }
    .acc   { fill:#0969da }
    .rule  { stroke:#d8dee6 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .cell  { fill:#161b22; stroke:#30363d }
      .padc  { fill:#3b2300; stroke:#9e6a03 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .warn  { fill:#d29922 }
      .acc   { fill:#4493f8 }
      .rule  { stroke:#30363d }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="376" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">PKCS#7 — 마지막 16바이트 블록은 언제나 패딩을 담는다</text>

  <!-- ① 12바이트만 채운 경우 -->
  <text class="ink" x="44" y="76" font-size="13">① 평문이 마지막 블록을 12바이트만 채웠다 → 남은 4바이트를 값 04 로 채운다</text>
  <rect class="cell" x="44"    y="86" width="594"  height="30" stroke-width="1"/>
  <text class="muted" x="341" y="106" font-size="12" text-anchor="middle">평문 12바이트</text>
  <rect class="padc" x="638"   y="86" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="687.5" y="86" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="737"   y="86" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="786.5" y="86" width="49.5" height="30" stroke-width="1"/>
  <text class="warn m" x="662.75" y="106" font-size="12" text-anchor="middle">04</text>
  <text class="warn m" x="712.25" y="106" font-size="12" text-anchor="middle">04</text>
  <text class="warn m" x="761.75" y="106" font-size="12" text-anchor="middle">04</text>
  <text class="warn m" x="811.25" y="106" font-size="12" text-anchor="middle">04</text>
  <text class="muted" x="44" y="134" font-size="11.5">제거 절차 — 마지막 바이트를 읽어 n=4 를 얻고, 끝 4바이트가 전부 04 인지 확인한 뒤 잘라낸다</text>

  <!-- ② 정확히 맞아떨어진 경우 -->
  <text class="ink" x="44" y="164" font-size="13">② 평문이 블록 경계에서 정확히 끝났다 → 값 16(0x10)뿐인 블록을 통째로 하나 더 붙인다</text>
  <rect class="padc" x="44"    y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="93.5"  y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="143"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="192.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="242"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="291.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="341"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="390.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="440"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="489.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="539"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="588.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="638"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="687.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="737"   y="174" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="786.5" y="174" width="49.5" height="30" stroke-width="1"/>
  <text class="warn m" x="68.75"  y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="118.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="167.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="217.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="266.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="316.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="365.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="415.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="464.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="514.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="563.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="613.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="662.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="712.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="761.75" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="warn m" x="811.25" y="194" font-size="12" text-anchor="middle">10</text>
  <text class="muted" x="44" y="222" font-size="11.5">붙이지 않으면, 평문이 우연히 04 04 04 04 로 끝났을 때 그 4바이트를 패딩으로 오인해 잘라낸다 — 제거 규칙이 유일하지 않다</text>

  <!-- ③ 실측 -->
  <text class="ink" x="44" y="252" font-size="13">③ 실측 — seg000.ts (TS 패킷 1,119개 = 210,372바이트, 16으로 나눈 나머지 4)</text>
  <rect class="cell" x="44"    y="262" width="198"  height="30" stroke-width="1"/>
  <text class="muted" x="143" y="282" font-size="12" text-anchor="middle">평문 4바이트</text>
  <rect class="padc" x="242"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="291.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="341"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="390.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="440"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="489.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="539"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="588.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="638"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="687.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="737"   y="262" width="49.5" height="30" stroke-width="1"/>
  <rect class="padc" x="786.5" y="262" width="49.5" height="30" stroke-width="1"/>
  <text class="warn m" x="266.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="316.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="365.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="415.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="464.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="514.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="563.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="613.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="662.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="712.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="761.75" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="warn m" x="811.25" y="282" font-size="12" text-anchor="middle">0c</text>
  <text class="muted" x="44" y="310" font-size="11.5">TS 세그먼트는 188 의 배수다. 188×N 을 16 으로 나눈 나머지는 (12N) mod 16 이므로 패딩 길이는 세그먼트마다 다르다</text>

  <line class="rule" x1="44" y1="328" x2="836" y2="328" stroke-width="1"/>
  <text class="acc" x="44" y="352" font-size="13" font-weight="600">n 은 1~16 이고 값 0 인 패딩은 없다 — 그래서 마지막 바이트 하나가 곧 패딩 길이다</text>
  <text class="muted" x="44" y="374" font-size="12">패딩이 유효하다는 사실은 마지막 두 블록에 대해서만 말한다. 그 앞이 온전한지에 대해서는 아무것도 말하지 않는다</text>
</svg>
