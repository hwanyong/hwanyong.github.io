<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" role="img"
     aria-label="자막이 60초 밀린 실행에서 각 층이 내는 신호. 자막 조각 수신은 200 OK, ffmpeg 이어붙이기는 exit 0, 생성된 파일은 유효한 WebVTT, 재생기 로드도 형식 유효로 모두 오류가 없다. 그러나 X-TIMESTAMP-MAP 으로 영상 시각에 맞추는 일은 어느 층도 맡지 않았고, 결과는 자막 전체가 60초 밀린 파일이다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .good  { fill:#1a7f37 }
    .bad   { fill:#cf222e }
    .warn  { fill:#9a6700 }
    .pillB { fill:#ffebe9 }
    .dash  { fill:none; stroke:#9a6700 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .good  { fill:#3fb950 }
      .bad   { fill:#f85149 }
      .warn  { fill:#d29922 }
      .pillB { fill:#3d1518 }
      .dash  { fill:none; stroke:#d29922 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar30a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="330" rx="10" stroke-width="1"/>
  <text class="ink" x="48" y="46" font-size="15" font-weight="600">자막이 60초 밀렸는데 어느 층도 오류를 내지 않는다</text>

  <rect class="box" x="48" y="68" width="180" height="84" rx="6" stroke-width="1"/>
  <text class="ink" x="138" y="94" font-size="12" text-anchor="middle" font-weight="600">자막 조각 수신</text>
  <text class="muted" x="138" y="114" font-size="11" text-anchor="middle">5개 모두 200 OK</text>
  <text class="good" x="138" y="136" font-size="11" text-anchor="middle">✓ 오류 없음</text>

  <rect class="box" x="249" y="68" width="180" height="84" rx="6" stroke-width="1"/>
  <text x="339" y="94" font-size="12" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan class="ink m">ffmpeg</tspan><tspan class="ink"> 이어붙이기</tspan></text>
  <text class="muted m" x="339" y="114" font-size="11" text-anchor="middle">exit 0</text>
  <text class="good" x="339" y="136" font-size="11" text-anchor="middle">✓ 오류 없음</text>

  <rect class="box" x="450" y="68" width="180" height="84" rx="6" stroke-width="1"/>
  <text class="ink" x="540" y="94" font-size="12" text-anchor="middle" font-weight="600">자막 파일 생성</text>
  <text class="muted" x="540" y="114" font-size="11" text-anchor="middle">유효한 WebVTT</text>
  <text class="good" x="540" y="136" font-size="11" text-anchor="middle">✓ 오류 없음</text>

  <rect class="box" x="651" y="68" width="180" height="84" rx="6" stroke-width="1"/>
  <text class="ink" x="741" y="94" font-size="12" text-anchor="middle" font-weight="600">재생기 로드</text>
  <text class="muted" x="741" y="114" font-size="11" text-anchor="middle">형식 유효</text>
  <text class="good" x="741" y="136" font-size="11" text-anchor="middle">✓ 오류 없음</text>

  <line x1="230" y1="110" x2="247" y2="110" class="arw" stroke-width="1.2" marker-end="url(#ar30a)"/>
  <line x1="431" y1="110" x2="448" y2="110" class="arw" stroke-width="1.2" marker-end="url(#ar30a)"/>
  <line x1="632" y1="110" x2="649" y2="110" class="arw" stroke-width="1.2" marker-end="url(#ar30a)"/>

  <rect class="dash" x="48" y="168" width="783" height="42" rx="6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="440" y="194" font-size="12.5" text-anchor="middle" xml:space="preserve"><tspan class="warn" font-weight="600">이 사이 어디에도 없는 일</tspan><tspan class="warn"> — </tspan><tspan class="warn m">X-TIMESTAMP-MAP</tspan><tspan class="warn"> 으로 영상 시각에 맞추기</tspan></text>

  <rect class="pillB" x="48" y="226" width="783" height="44" rx="8"/>
  <text class="bad" x="440" y="253" font-size="13.5" text-anchor="middle" font-weight="600">결과: 자막 전체가 60초 밀린 파일 — 그런데 종료 코드는 0</text>

  <text x="48" y="306" font-size="12.5" xml:space="preserve"><tspan class="ink" font-weight="600">어느 층도 자기 몫을 빠뜨리지 않았다.</tspan><tspan class="muted"> 그 일을 맡은 층이 없었을 뿐이다.</tspan></text>
</svg>
