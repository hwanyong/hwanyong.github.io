<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img"
     aria-label="두 관측이 합쳐져야 결론이 성립한다. 결함 검출 단계에서 hls-recon 이 종료 코드 2 를 냈다는 관측과, 대조군 단계에서 ffmpeg 단독이 같은 입력에 종료 코드 0 을 냈다는 관측이 함께 있어야 ffmpeg 은 이 결손을 놓친다는 문장이 성립한다. 어느 한쪽만으로는 결론이 나오지 않는다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .hl    { fill:#ddf4ff; stroke:#54aeff }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .warn  { fill:#9a6700 }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .hl    { fill:#0c2d6b; stroke:#4493f8 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .warn  { fill:#d29922 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="270" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">두 관측이 합쳐져야 한 문장이 성립한다</text>

  <rect class="box" x="52" y="70" width="380" height="56" rx="8" stroke-width="1"/>
  <text class="muted" x="70" y="92" font-size="11.5">[3/4] 결함 검출</text>
  <text x="70" y="112" font-size="12.5" xml:space="preserve"><tspan class="ink">hls-recon 이 </tspan><tspan class="good m" font-weight="600">exit 2</tspan><tspan class="ink"> — 결손이 실재한다</tspan></text>

  <rect class="box" x="52" y="142" width="380" height="56" rx="8" stroke-width="1"/>
  <text class="muted" x="70" y="164" font-size="11.5">[4/4] 대조군</text>
  <text x="70" y="184" font-size="12.5" xml:space="preserve"><tspan class="ink">ffmpeg 단독이 </tspan><tspan class="bad m" font-weight="600">exit 0</tspan><tspan class="ink"> — 보고하지 않는다</tspan></text>

  <path d="M432,98 L510,124" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar2)"/>
  <path d="M432,170 L510,144" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar2)"/>
  <text class="muted" x="468" y="138" font-size="11.5" text-anchor="middle">그리고</text>

  <rect class="hl" x="520" y="98" width="308" height="72" rx="8" stroke-width="1.4"/>
  <text class="ink" x="674" y="126" font-size="13" text-anchor="middle" font-weight="600">"ffmpeg 은 이 결손을 놓친다"</text>
  <text class="acc" x="674" y="148" font-size="12" text-anchor="middle">= 이 도구의 존재 이유</text>

  <text class="warn" x="44" y="228" font-size="12.5" xml:space="preserve"><tspan font-weight="600">[4/4] 만으로는 결론이 없다</tspan><tspan class="muted"> — ffmpeg 이 성공했다는 사실뿐, 그 입력에 결손이 있었는지는 말하지 않는다.</tspan></text>
  <text class="warn" x="44" y="252" font-size="12.5" xml:space="preserve"><tspan font-weight="600">[3/4] 만으로도 결론이 없다</tspan><tspan class="muted"> — 우리가 잡았다는 사실뿐, 남들도 잡는지는 말하지 않는다.</tspan></text>
</svg>
