<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="대조군과 처치군. 같은 결함 주입 스트림을 두 실행이 받는다. 대조군은 ffmpeg 단독으로 재조립해 종료 코드 0 을 내고, 처치군인 hls-recon 은 같은 ffmpeg 재조립 위에 계측 계층을 얹어 종료 코드 2 를 낸다. 두 실행의 차이는 계측 계층 하나뿐이다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .neut  { fill:#eaeef2 }
    .hl    { fill:#ddf4ff; stroke:#54aeff }
    .void  { fill:none; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .neut  { fill:#21262d }
      .hl    { fill:#0c2d6b; stroke:#4493f8 }
      .void  { fill:none; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="350" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">통제된 비교 — 달라진 것은 계측 계층 하나뿐이다</text>

  <rect class="neut" x="290" y="62" width="300" height="38" rx="6"/>
  <text x="440" y="86" font-size="12.5" text-anchor="middle" xml:space="preserve"><tspan class="ink m">damaged/index.m3u8</tspan><tspan class="muted"> — 결함 4종</tspan></text>

  <path d="M380,100 L380,116 Q380,124 370,124 L242,124 Q232,124 232,132 L232,142" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M500,100 L500,116 Q500,124 510,124 L638,124 Q648,124 648,132 L648,142" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="muted" x="440" y="128" font-size="11.5" text-anchor="middle">같은 입력</text>

  <rect class="panel" x="52" y="144" width="360" height="176" rx="8" stroke-width="1"/>
  <text class="muted" x="232" y="168" font-size="11.5" text-anchor="middle">대조군 — ffmpeg 단독</text>
  <rect class="neut" x="76" y="180" width="312" height="38" rx="6"/>
  <text class="ink m" x="232" y="204" font-size="12" text-anchor="middle">ffmpeg -c copy 재조립</text>
  <rect class="void" x="76" y="228" width="312" height="38" rx="6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="muted" x="232" y="252" font-size="12" text-anchor="middle">계측 계층 없음</text>
  <text class="bad" x="232" y="298" font-size="13" text-anchor="middle" font-weight="600">exit 0 — 결손을 보고하지 않음</text>

  <rect class="panel" x="468" y="144" width="360" height="176" rx="8" stroke-width="1"/>
  <text class="muted" x="648" y="168" font-size="11.5" text-anchor="middle">처치군 — hls-recon</text>
  <rect class="neut" x="492" y="180" width="312" height="38" rx="6"/>
  <text class="ink m" x="648" y="204" font-size="12" text-anchor="middle">ffmpeg -c copy 재조립</text>
  <rect class="hl" x="492" y="228" width="312" height="38" rx="6" stroke-width="1.4"/>
  <text x="648" y="252" font-size="12" text-anchor="middle" xml:space="preserve"><tspan class="acc" font-weight="600">계측 계층</tspan><tspan class="ink"> 수신·CC·해시·gap_scan</tspan></text>
  <text class="good" x="648" y="298" font-size="13" text-anchor="middle" font-weight="600">exit 2 — 타임라인 결손 FAIL</text>

  <text x="44" y="344" font-size="12.5" xml:space="preserve"><tspan class="ink" font-weight="600">재조립 명령은 양쪽이 같다.</tspan><tspan class="muted"> 처치는 "ffmpeg 대신 우리"가 아니라 "ffmpeg 위에 계측 계층 하나"다 — 주장의 범위도 거기까지다.</tspan></text>
</svg>
