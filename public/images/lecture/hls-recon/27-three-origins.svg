<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" role="img"
     aria-label="세 개의 원점. 하나의 순간이 자막 로컬 축에서는 6.000초, MPEG-TS 90kHz 축에서는 10.000초, 출력 파일 축에서는 8.577초로 읽힌다. 세 축의 0 이 서로 다른 곳에 있고, 오프셋은 자막 축의 0 과 출력 축의 0 사이 거리다. 아래 막대 넷이 offset = mpegts 나누기 90000 빼기 video_pts0 빼기 local_sec 을 구간 뺄셈으로 보여준다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .axis  { stroke:#656d76 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .good  { fill:#1a7f37 }
    .goods { stroke:#1a7f37 }
    .warn  { fill:#9a6700 }
    .warns { stroke:#9a6700 }
    .dot   { fill:#1f2328 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .axis  { stroke:#8b949e }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .good  { fill:#3fb950 }
      .goods { stroke:#3fb950 }
      .warn  { fill:#d29922 }
      .warns { stroke:#d29922 }
      .dot   { fill:#e6edf3 }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a27a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="396" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">세 개의 원점 — 같은 한 순간이 세 축에서 다른 숫자로 읽힌다</text>

  <line class="accs" x1="520" y1="66" x2="520" y2="400" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="acc" x="528" y="78" font-size="12" font-weight="600">자막 조각이 알려준 대응점</text>

  <text class="ink" x="44" y="106" font-size="13" font-weight="600">① 자막 로컬 축</text>
  <text class="muted" x="44" y="124" font-size="11.5">WebVTT 파일 자신의 시각</text>
  <line class="axis" x1="400" y1="112" x2="826" y2="112" stroke-width="1.4" marker-end="url(#a27a)"/>
  <circle class="dot" cx="400" cy="112" r="4"/>
  <text class="muted m" x="392" y="132" font-size="12">0</text>
  <text class="acc m" x="458" y="102" font-size="12.5" font-weight="600">6.000s</text>

  <text class="ink" x="44" y="180" font-size="13" font-weight="600">② MPEG-TS 90kHz 축</text>
  <text class="muted" x="44" y="198" font-size="11.5">패키저가 정한 절대 좌표</text>
  <line class="axis" x1="320" y1="186" x2="826" y2="186" stroke-width="1.4" marker-end="url(#a27a)"/>
  <circle class="dot" cx="320" cy="186" r="4"/>
  <text class="muted m" x="312" y="206" font-size="12">0</text>
  <text class="acc m" x="452" y="176" font-size="12.5" font-weight="600">10.000s</text>

  <text class="ink" x="44" y="254" font-size="13" font-weight="600">③ 출력 파일 축</text>
  <text class="muted" x="44" y="272" font-size="11.5">영상 첫 프레임이 0</text>
  <line class="axis" x1="348" y1="260" x2="826" y2="260" stroke-width="1.4" marker-end="url(#a27a)"/>
  <circle class="dot" cx="348" cy="260" r="4"/>
  <text class="muted m" x="340" y="280" font-size="12">0</text>
  <text class="acc m" x="458" y="250" font-size="12.5" font-weight="600">8.577s</text>

  <line class="rule" x1="44" y1="296" x2="836" y2="296" stroke-width="1"/>
  <text class="muted" x="44" y="318" font-size="12">같은 눈금(20px = 1초)으로 그린 구간 뺄셈</text>

  <line class="accs" x1="320" y1="336" x2="520" y2="336" stroke-width="6"/>
  <text class="ink m" x="536" y="341" font-size="12.5" xml:space="preserve"><tspan class="acc" font-weight="600">mpegts / 90000</tspan><tspan> = 10.000s</tspan></text>

  <line class="warns" x1="320" y1="358" x2="348" y2="358" stroke-width="6"/>
  <text class="ink m" x="536" y="363" font-size="12.5" xml:space="preserve"><tspan class="warn" font-weight="600">− video_pts0</tspan><tspan> = 1.423s</tspan></text>

  <line class="warns" x1="400" y1="380" x2="520" y2="380" stroke-width="6"/>
  <text class="ink m" x="536" y="385" font-size="12.5" xml:space="preserve"><tspan class="warn" font-weight="600">− local_sec</tspan><tspan> = 6.000s</tspan></text>

  <line class="goods" x1="348" y1="402" x2="400" y2="402" stroke-width="6"/>
  <text class="ink m" x="536" y="407" font-size="12.5" xml:space="preserve"><tspan class="good" font-weight="600">= offset</tspan><tspan> = +2.577s</tspan></text>
</svg>
