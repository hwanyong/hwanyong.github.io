<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" role="img"
     aria-label="게이트 하나만으로는 가짜 구현이 통과한다. 참 검증기는 정상 스트림 게이트와 결함 스트림 게이트를 모두 통과하고, 항상 PASS 를 내는 구현은 정상 게이트만 통과하며, 항상 FAIL 을 내는 구현은 결함 게이트의 종료 코드 항목 하나만 통과한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .live  { fill:#dafbe1; stroke:#4ac26b }
    .dead  { fill:#ffebe9; stroke:#ff8182 }
    .neut  { fill:#eaeef2 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .warn  { fill:#9a6700 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .live  { fill:#12291d; stroke:#3fb950 }
      .dead  { fill:#3d1518; stroke:#f85149 }
      .neut  { fill:#21262d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .warn  { fill:#d29922 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="288" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">게이트 하나만으로는 가짜 구현이 통과한다</text>

  <text class="muted" x="144" y="74" font-size="11.5" text-anchor="middle">후보 구현</text>
  <text class="muted" x="358" y="74" font-size="11.5" text-anchor="middle">게이트 ① 정상 스트림 → PASS 여야</text>
  <text class="muted" x="574" y="74" font-size="11.5" text-anchor="middle">게이트 ② 결함 스트림 → FAIL 여야</text>
  <text class="muted" x="762" y="74" font-size="11.5" text-anchor="middle">남는가</text>

  <rect class="box"  x="44"  y="84" width="200" height="46" rx="8" stroke-width="1"/>
  <text class="ink" x="144" y="105" font-size="12.5" text-anchor="middle">참 검증기</text>
  <text class="muted m" x="144" y="121" font-size="11.5" text-anchor="middle">hls-recon</text>
  <rect class="live" x="256" y="84" width="204" height="46" rx="8" stroke-width="1.4"/>
  <text x="358" y="112" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="good" font-weight="600">6/6 통과</tspan></text>
  <rect class="live" x="472" y="84" width="204" height="46" rx="8" stroke-width="1.4"/>
  <text x="574" y="112" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="good" font-weight="600">6/6 통과</tspan></text>
  <text class="good" x="762" y="112" font-size="13" text-anchor="middle" font-weight="600">남는다</text>

  <rect class="box"  x="44"  y="138" width="200" height="46" rx="8" stroke-width="1"/>
  <text class="ink" x="144" y="159" font-size="12.5" text-anchor="middle">항상 PASS</text>
  <text class="muted m" x="144" y="175" font-size="11.5" text-anchor="middle">exit 0</text>
  <rect class="live" x="256" y="138" width="204" height="46" rx="8" stroke-width="1.4"/>
  <text x="358" y="166" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="good" font-weight="600">6/6 통과</tspan><tspan class="muted"> — 구별되지 않는다</tspan></text>
  <rect class="dead" x="472" y="138" width="204" height="46" rx="8" stroke-width="1.4"/>
  <text x="574" y="166" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="bad" font-weight="600">0/6</tspan><tspan class="muted"> — 여기서 걸린다</tspan></text>
  <text class="bad" x="762" y="166" font-size="13" text-anchor="middle" font-weight="600">배제</text>

  <rect class="box"  x="44"  y="192" width="200" height="46" rx="8" stroke-width="1"/>
  <text class="ink" x="144" y="213" font-size="12.5" text-anchor="middle">항상 FAIL</text>
  <text class="muted m" x="144" y="229" font-size="11.5" text-anchor="middle">exit 2</text>
  <rect class="dead" x="256" y="192" width="204" height="46" rx="8" stroke-width="1.4"/>
  <text x="358" y="220" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="bad" font-weight="600">0/6</tspan><tspan class="muted"> — 여기서 걸린다</tspan></text>
  <rect class="neut" x="472" y="192" width="204" height="46" rx="8"/>
  <text x="574" y="220" font-size="13" text-anchor="middle" xml:space="preserve"><tspan class="warn" font-weight="600">1/6</tspan><tspan class="muted"> — 종료 코드만 맞음</tspan></text>
  <text class="bad" x="762" y="220" font-size="13" text-anchor="middle" font-weight="600">배제</text>

  <text class="acc" x="44" y="264" font-size="12.5" xml:space="preserve"><tspan font-weight="600">게이트 ①만 두면 </tspan><tspan class="ink m">exit 0</tspan><tspan font-weight="600"> 한 줄이 통과하고, 게이트 ②만 두면 </tspan><tspan class="ink m">exit 2</tspan><tspan font-weight="600"> 한 줄이 통과한다.</tspan></text>
  <text class="muted" x="44" y="286" font-size="12">숫자는 실측이다 — 두 스텁을 만들어 tests/run.sh 의 두 블록을 그대로 돌린 결과.</text>
</svg>
