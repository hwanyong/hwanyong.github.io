<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="expect_pass 는 한 번의 실행에서 두 관측 채널을 함께 본다. 종료 코드 채널은 WARN 을 0 으로 내리므로 PASS 와 구별하지 못하고, 표준 출력의 실패 표시 채널은 WARN 을 느낌표로 찍으므로 걸러내지 못한다. 두 채널의 사각지대가 겹치지 않으므로 둘을 함께 요구한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .gate  { fill:#ddf4ff; stroke:#54aeff }
    .blind { fill:#fff8c5; stroke:#d4a72c }
    .neut  { fill:#eaeef2 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .warn  { fill:#9a6700 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .gate  { fill:#121d2f; stroke:#4493f8 }
      .blind { fill:#2e2a10; stroke:#d29922 }
      .neut  { fill:#21262d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .warn  { fill:#d29922 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="344" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">한 판정, 두 관측 채널 — 사각지대가 겹치지 않는다</text>

  <rect class="neut" x="330" y="60" width="220" height="34" rx="6"/>
  <text class="ink m" x="440" y="82" font-size="12.5" text-anchor="middle">hls-recon &lt;정상 스트림&gt;</text>

  <path d="M420,94 L420,102 Q420,110 410,110 L240,110 L240,118" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M460,94 L460,102 Q460,110 470,110 L650,110 L650,118" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect class="gate" x="44" y="120" width="392" height="124" rx="8" stroke-width="1.4"/>
  <text class="ink" x="64" y="143" font-size="13" font-weight="600">채널 A — 종료 코드</text>
  <text x="64" y="166" font-size="12.5" xml:space="preserve"><tspan class="m ink">PASS → 0</tspan><tspan class="muted">   </tspan><tspan class="m ink">WARN → 0</tspan><tspan class="muted">   </tspan><tspan class="m ink">FAIL → 2</tspan></text>
  <text class="muted m" x="64" y="184" font-size="11.5">cli.py:651-652</text>
  <rect class="blind" x="60" y="196" width="360" height="34" rx="6" stroke-width="1.2"/>
  <text x="240" y="218" font-size="12" text-anchor="middle" xml:space="preserve"><tspan class="warn" font-weight="600">사각지대 </tspan><tspan class="ink">WARN 이 0 이라 PASS 와 구별되지 않는다</tspan></text>

  <rect class="gate" x="464" y="120" width="392" height="124" rx="8" stroke-width="1.4"/>
  <text class="ink" x="484" y="143" font-size="13" font-weight="600">채널 B — 표준 출력의 ✗</text>
  <text x="484" y="166" font-size="12.5" xml:space="preserve"><tspan class="ink">검사줄의 FAIL 표시 </tspan><tspan class="muted m">report.py:71</tspan></text>
  <text x="484" y="184" font-size="12.5" xml:space="preserve"><tspan class="ink">처리 중 개별 실패 </tspan><tspan class="muted m">cli.py:335·358·454·463</tspan></text>
  <rect class="blind" x="480" y="196" width="360" height="34" rx="6" stroke-width="1.2"/>
  <text x="660" y="218" font-size="12" text-anchor="middle" xml:space="preserve"><tspan class="warn" font-weight="600">사각지대 </tspan><tspan class="ink">WARN 은 ! 로 찍혀 걸리지 않는다</tspan></text>

  <path d="M240,244 L240,256 Q240,264 250,264 L420,264 L420,272" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M650,244 L650,256 Q650,264 640,264 L460,264 L460,272" class="arw" fill="none" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect class="box" x="280" y="274" width="320" height="52" rx="8" stroke-width="1.4"/>
  <text class="muted" x="440" y="294" font-size="11.5" text-anchor="middle">expect_pass 통과 조건 (tests/run.sh:165)</text>
  <text x="440" y="314" font-size="12.5" text-anchor="middle" xml:space="preserve"><tspan class="ink m">종료 코드 0</tspan><tspan class="acc" font-weight="600">  그리고  </tspan><tspan class="ink m">로그에 ✗ 없음</tspan></text>

  <text class="acc" x="44" y="348" font-size="12.5" xml:space="preserve"><tspan font-weight="600">채널 B 는 집계 판정에 도달하지 못한 개별 실패까지 본다</tspan><tspan class="muted"> — 이웃 화수 수집은 일부만 실패해도 판정이 PASS 다(report.py:464-469).</tspan></text>
</svg>
