<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img"
     aria-label="RFC 8216 의 규정 범위. 플레이리스트는 경로 확장자나 Content-Type 으로 식별되어야 한다는 MUST 요구가 있지만, 미디어 세그먼트는 포맷만 규정되고 URI 와 Content-Type 에 대한 요구가 없다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .gap   { fill:#fff8c5; stroke:#d4a72c }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .warn  { fill:#9a6700 }
    .pillA { fill:#ddf4ff }
    .pillW { fill:#fff1c2 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .gap   { fill:#2b2512; stroke:#9e6a03 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .warn  { fill:#d29922 }
      .pillA { fill:#123a63 }
      .pillW { fill:#4d3c12 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="268" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">RFC 8216 이 확장자·타입에 요구를 두는 대상은 하나뿐이다</text>

  <rect class="box" x="44" y="62" width="792" height="86" rx="8" stroke-width="1"/>
  <text class="ink" x="66" y="90" font-size="14" font-weight="600">플레이리스트</text>
  <text class="muted" x="66" y="112" font-size="12">.m3u8 파일</text>
  <text class="ink" x="230" y="90" font-size="12.5">경로가 </text>
  <text class="acc m" x="278" y="90" font-size="12.5">.m3u8</text>
  <text class="ink" x="326" y="90" font-size="12.5"> / </text>
  <text class="acc m" x="344" y="90" font-size="12.5">.m3u</text>
  <text class="ink" x="384" y="90" font-size="12.5"> 로 끝나거나</text>
  <text class="ink" x="230" y="114" font-size="12.5">Content-Type 이 </text>
  <text class="acc m" x="345" y="114" font-size="12">application/vnd.apple.mpegurl</text>
  <rect class="pillA" x="680" y="92" width="136" height="26" rx="13"/>
  <text class="acc" x="748" y="109" font-size="12.5" text-anchor="middle" font-weight="600">MUST — 규정됨</text>

  <rect class="gap" x="44" y="160" width="792" height="86" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="ink" x="66" y="188" font-size="14" font-weight="600">미디어 세그먼트</text>
  <text class="muted" x="66" y="210" font-size="12">실제 영상 조각</text>
  <text class="ink" x="230" y="188" font-size="12.5">포맷만 규정한다 (MPEG-TS · ISO-BMFF …)</text>
  <text class="warn" x="230" y="212" font-size="12.5" font-weight="600">URI 확장자와 Content-Type 에 대한 요구는 없다</text>
  <rect class="pillW" x="680" y="190" width="136" height="26" rx="13"/>
  <text class="warn" x="748" y="207" font-size="12.5" text-anchor="middle" font-weight="600">규정 없음 — 빈틈</text>

  <text class="muted" x="44" y="272" font-size="12.5" xml:space="preserve"><tspan>위장은 이 빈틈에서 성립한다. </tspan><tspan class="ink" font-weight="600">HLS 규격 위반은 아니다.</tspan><tspan> 다만 MPEG-TS 를 </tspan><tspan class="m">text/html</tspan><tspan> 로 선언하는 것은 </tspan><tspan class="ink" font-weight="600">HTTP 규격 위반</tspan><tspan>이다.</tspan></text>
</svg>
