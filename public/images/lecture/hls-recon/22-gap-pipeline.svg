<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" role="img"
     aria-label="갭 판정 파이프라인 여섯 단계와 각 단계를 빼면 생기는 오류. 수집·정렬·인접차·중앙값·임계·비교 순으로 진행하며, 정렬을 빼면 저프레임률에서 오탐 9건, 중앙값을 평균으로 바꾸면 결손 15건이 0건으로 미탐, floor 를 빼면 60fps 임계가 400에서 50밀리초로 떨어진다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .rule  { stroke:#d8dee6 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .chip  { fill:#eaeef2 }
    .mk    { fill:#656d76 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .rule  { stroke:#30363d }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .chip  { fill:#21262d }
      .mk    { fill:#8b949e }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="a22" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="16" width="840" height="384" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="48" font-size="15" font-weight="600">갭 판정은 여섯 단계다 — 각 단계는 특정한 오류 하나를 막는다</text>

  <text class="muted" x="44" y="76" font-size="11.5" font-weight="600">단계</text>
  <text class="muted" x="214" y="76" font-size="11.5" font-weight="600">코드 (probe.py)</text>
  <text class="muted" x="480" y="76" font-size="11.5" font-weight="600">이 단계가 없으면 — 실측</text>

  <rect class="panel" x="40" y="88" width="420" height="272" rx="8"/>
  <line class="accs" x1="60" y1="112" x2="60" y2="336" stroke-width="1.5" marker-end="url(#a22)"/>

  <circle class="chip" cx="60" cy="112" r="11"/>
  <text class="muted" x="60" y="116" font-size="11" text-anchor="middle" font-weight="600">0</text>
  <text class="ink" x="82" y="116" font-size="12.5">시각 수집</text>
  <text class="muted m" x="214" y="116" font-size="11">packet=pts_time · 213-220</text>
  <text class="muted" x="480" y="116" font-size="12">시각 없는 패킷이 섞여 간격이 왜곡된다.</text>
  <text class="good" x="480" y="132" font-size="12">3개 미만이면 판정 자체를 포기한다(ok=False).</text>

  <circle class="chip" cx="60" cy="164" r="11"/>
  <text class="muted" x="60" y="168" font-size="11" text-anchor="middle" font-weight="600">1</text>
  <text class="ink" x="82" y="168" font-size="12.5">표시 시각 정렬</text>
  <text class="acc m" x="214" y="168" font-size="11">times.sort() · 223</text>
  <text x="480" y="168" font-size="12" xml:space="preserve"><tspan class="bad" font-weight="600">오탐.</tspan><tspan class="muted"> B-프레임 재정렬이 가짜 간격이 된다 —</tspan></text>
  <text class="muted" x="480" y="184" font-size="12">5fps·bf=3 에서 9건, 30fps 에서는 0건.</text>

  <circle class="chip" cx="60" cy="216" r="11"/>
  <text class="muted" x="60" y="220" font-size="11" text-anchor="middle" font-weight="600">2</text>
  <text class="ink" x="82" y="220" font-size="12.5">인접 차</text>
  <text class="muted m" x="214" y="220" font-size="11">b - a · 224</text>
  <text class="muted" x="480" y="220" font-size="12">간격은 프레임 사이의 값이므로, 보고되는 결손</text>
  <text class="muted" x="480" y="236" font-size="12">길이는 실제보다 정확히 한 프레임분 길다.</text>

  <circle class="chip" cx="60" cy="268" r="11"/>
  <text class="muted" x="60" y="272" font-size="11" text-anchor="middle" font-weight="600">3</text>
  <text class="ink" x="82" y="272" font-size="12.5">중앙값</text>
  <text class="acc m" x="214" y="272" font-size="11">ordered[len//2] · 225-226</text>
  <text x="480" y="272" font-size="12" xml:space="preserve"><tspan class="bad" font-weight="600">미탐.</tspan><tspan class="muted"> 평균으로 바꾸면 결손이 임계를 끌어올려</tspan></text>
  <text class="muted" x="480" y="288" font-size="12">5fps 실측에서 15건 → 0건, 완전 실명.</text>

  <circle class="chip" cx="60" cy="320" r="11"/>
  <text class="muted" x="60" y="324" font-size="11" text-anchor="middle" font-weight="600">4</text>
  <text class="ink" x="82" y="324" font-size="12.5">임계 결정</text>
  <text class="acc m" x="214" y="324" font-size="11">max(floor, median*3) · 227</text>
  <text x="480" y="324" font-size="12" xml:space="preserve"><tspan class="bad" font-weight="600">오탐.</tspan><tspan class="muted"> floor 를 빼면 60fps 임계가 400 → 50ms.</tspan></text>
  <text class="muted" x="480" y="340" font-size="12">대신 floor 를 두면 100ms 결손은 놓친다.</text>

  <line class="rule" x1="44" y1="360" x2="836" y2="360" stroke-width="1"/>
  <text x="44" y="384" font-size="13" xml:space="preserve"><tspan class="muted">⑤ 비교 </tspan><tspan class="acc m" font-weight="600">d &gt; threshold</tspan><tspan class="muted"> · 230-232 — 부등호가 엄격하므로 임계와 정확히 같은 간격은 결손이 아니다. 30fps 에서 </tspan><tspan class="ink" font-weight="600">11프레임 결손(간격 400.000ms)은 통과</tspan><tspan class="muted">한다.</tspan></text>
</svg>
