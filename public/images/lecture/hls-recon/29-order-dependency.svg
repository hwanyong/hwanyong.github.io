<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" role="img"
     aria-label="같은 큐의 두 사본을 두고 처리 순서를 비교한 그림. 이어붙인 직후 조각 000 이 실은 사본의 본문에는 조각 헤더 WEBVTT 와 X-TIMESTAMP-MAP 이 흡수돼 있고 조각 001 이 실은 사본은 깨끗하다. 왼쪽은 헤더를 먼저 정제한 뒤 중복을 판정하는 현재 코드로, 두 키가 같아져 중복 한 건이 제거되고 9 큐가 6 큐가 된다. 오른쪽은 순서를 뒤집어 먼저 판정하고 나중에 정제하는 판본으로, 두 키가 달라 하나도 제거되지 않고 9 큐가 그대로 남지만 헤더는 나중에 지워지므로 파일은 깨끗해 보인다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .okbx  { fill:#f6f8fa; stroke:#4ac26b }
    .nobx  { fill:#f6f8fa; stroke:#ff8182 }
    .chip  { fill:#eaeef2 }
    .pillG { fill:#dafbe1 }
    .pillR { fill:#ffebe9 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .okbx  { fill:#161b22; stroke:#2ea043 }
      .nobx  { fill:#161b22; stroke:#da3633 }
      .chip  { fill:#21262d }
      .pillG { fill:#12341f }
      .pillR { fill:#3c1618 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="422" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">한쪽 사본에만 조각 헤더가 붙어 있다 — 무엇을 먼저 하느냐가 결과를 바꾼다</text>

  <rect class="box" x="44" y="58" width="792" height="112" rx="8" stroke-width="1"/>
  <text class="muted" x="60" y="80" font-size="12">ffmpeg 가 조각을 이어붙인 직후 — 시작 5.000 · 끝 9.000 인 같은 큐가 두 벌 남아 있다</text>
  <text class="ink" x="60" y="106" font-size="12" font-weight="600">조각 000 이 실은 사본</text>
  <text class="ink" x="460" y="106" font-size="12" font-weight="600">조각 001 이 실은 사본</text>
  <text class="ink m" x="60" y="128" font-size="12.5">한국어 자막 2번</text>
  <text class="ink m" x="460" y="128" font-size="12.5">한국어 자막 2번</text>
  <text class="bad m" x="60" y="146" font-size="12">WEBVTT</text>
  <text class="bad" x="200" y="146" font-size="11.5">← 조각 헤더가 앞 큐의 본문으로 흡수됐다</text>
  <text class="muted" x="460" y="146" font-size="11.5">(헤더 없음 — 깨끗하다)</text>
  <text class="bad m" x="60" y="163" font-size="12">X-TIMESTAMP-MAP=LOCAL:00:00:00.000,MPEGTS:126000</text>

  <line class="arw" x1="240" y1="172" x2="240" y2="196" stroke-width="1.2" marker-end="url(#ar29)"/>
  <line class="arw" x1="640" y1="172" x2="640" y2="196" stroke-width="1.2" marker-end="url(#ar29)"/>

  <rect class="okbx" x="44" y="200" width="386" height="196" rx="8" stroke-width="1.5"/>
  <text class="ink" x="60" y="224" font-size="13" font-weight="600">① 헤더 정제 → ② 중복 판정</text>
  <text class="acc" x="60" y="243" font-size="11.5">subtitles.py:296-301 — 현재 코드</text>
  <text class="muted" x="60" y="268" font-size="12">두 사본의 본문이 같아진다</text>
  <rect class="chip" x="60" y="276" width="354" height="26" rx="5"/>
  <text class="ink m" x="70" y="293" font-size="12">(5.0, 9.0, '한국어 자막 2번')</text>
  <rect class="chip" x="60" y="308" width="354" height="26" rx="5"/>
  <text class="ink m" x="70" y="325" font-size="12">(5.0, 9.0, '한국어 자막 2번')</text>
  <text class="good" x="60" y="352" font-size="13" font-weight="600">키가 같다 → 중복 1건 제거</text>
  <rect class="pillG" x="60" y="360" width="354" height="30" rx="8"/>
  <text class="good" x="237" y="380" font-size="13" font-weight="600" text-anchor="middle">9큐 → 6큐</text>

  <rect class="nobx" x="450" y="200" width="386" height="196" rx="8" stroke-width="1.5"/>
  <text class="ink" x="466" y="224" font-size="13" font-weight="600">① 중복 판정 → ② 헤더 정제</text>
  <text class="bad" x="466" y="243" font-size="11.5">순서를 뒤집은 판본 — 실측</text>
  <text class="muted" x="466" y="268" font-size="12">오염된 쪽과 깨끗한 쪽의 본문이 다르다</text>
  <rect class="chip" x="466" y="276" width="354" height="26" rx="5"/>
  <text class="ink m" x="476" y="293" font-size="12">(5.0, 9.0, '한국어 자막 2번\nWEBVTT\n…')</text>
  <rect class="chip" x="466" y="308" width="354" height="26" rx="5"/>
  <text class="ink m" x="476" y="325" font-size="12">(5.0, 9.0, '한국어 자막 2번')</text>
  <text class="bad" x="466" y="352" font-size="13" font-weight="600">키가 다르다 → 하나도 제거되지 않는다</text>
  <rect class="pillR" x="466" y="360" width="354" height="30" rx="8"/>
  <text class="bad" x="643" y="380" font-size="13" font-weight="600" text-anchor="middle">9큐 그대로 — 파일은 깨끗해 보인다</text>

  <text class="muted" x="44" y="420" font-size="12">두 실패는 증상이 다르다 — 뒤집은 판본은 헤더 검사를 통과하고 큐 수 검사만 깨진다. 그래서 둘을 따로 고정한다</text>
</svg>
