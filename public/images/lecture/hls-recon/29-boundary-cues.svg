<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img"
     aria-label="자막 조각 다섯 개와 원본 큐 여섯 개를 같은 시간축에 놓은 그림. 조각 경계를 가로지르는 큐 2, 3, 4 는 인접한 두 조각 양쪽에 실려 두 번 나타나고, 나머지는 한 번만 나타난다. 조각이 실은 큐 수는 순서대로 2, 2, 2, 2, 1 이며 합계 9 큐다. 고유한 큐는 6 개이므로 경계 중복이 3 큐다. 큐 5 는 끝이 조각 경계와 정확히 일치해 다음 조각에는 실리지 않는다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .box   { fill:#f6f8fa; stroke:#d8dee6 }
    .hi    { fill:#fff8c5; stroke:#d4a72c }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .warn  { fill:#9a6700 }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .rule  { stroke:#afb8c1 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .box   { fill:#161b22; stroke:#30363d }
      .hi    { fill:#3b2300; stroke:#9e6a03 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .warn  { fill:#d29922 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .rule  { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="272" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">경계에 걸친 큐는 인접한 두 조각 양쪽에 실린다</text>
  <text class="muted" x="44" y="65" font-size="12">규격이 허용하는 동작이다 — 어느 조각부터 재생을 시작해도 그 큐가 보여야 하기 때문이다</text>

  <text class="muted" x="44" y="101" font-size="12">자막 조각</text>
  <rect class="box" x="142" y="80" width="132" height="34" rx="6" stroke-width="1"/>
  <rect class="box" x="278" y="80" width="132" height="34" rx="6" stroke-width="1"/>
  <rect class="box" x="414" y="80" width="132" height="34" rx="6" stroke-width="1"/>
  <rect class="box" x="550" y="80" width="132" height="34" rx="6" stroke-width="1"/>
  <rect class="box" x="686" y="80" width="132" height="34" rx="6" stroke-width="1"/>
  <text class="ink m" x="208" y="102" font-size="12" text-anchor="middle">seg000</text>
  <text class="ink m" x="344" y="102" font-size="12" text-anchor="middle">seg001</text>
  <text class="ink m" x="480" y="102" font-size="12" text-anchor="middle">seg002</text>
  <text class="ink m" x="616" y="102" font-size="12" text-anchor="middle">seg003</text>
  <text class="ink m" x="752" y="102" font-size="12" text-anchor="middle">seg004</text>

  <line class="rule" x1="276" y1="76" x2="276" y2="178" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="rule" x1="412" y1="76" x2="412" y2="178" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="rule" x1="548" y1="76" x2="548" y2="178" stroke-width="1" stroke-dasharray="4 3"/>
  <line class="rule" x1="684" y1="76" x2="684" y2="178" stroke-width="1" stroke-dasharray="4 3"/>

  <text class="muted" x="44" y="149" font-size="12">원본 큐</text>
  <rect class="box" x="140" y="132" width="91" height="24" rx="5" stroke-width="1"/>
  <rect class="hi"  x="253" y="132" width="91" height="24" rx="5" stroke-width="1.4"/>
  <rect class="hi"  x="367" y="132" width="91" height="24" rx="5" stroke-width="1.4"/>
  <rect class="hi"  x="480" y="132" width="91" height="24" rx="5" stroke-width="1.4"/>
  <rect class="box" x="593" y="132" width="91" height="24" rx="5" stroke-width="1"/>
  <rect class="box" x="707" y="132" width="91" height="24" rx="5" stroke-width="1"/>
  <text class="ink" x="185" y="149" font-size="11.5" text-anchor="middle">큐 1</text>
  <text class="ink" x="298" y="149" font-size="11.5" text-anchor="middle">큐 2</text>
  <text class="ink" x="412" y="149" font-size="11.5" text-anchor="middle">큐 3</text>
  <text class="ink" x="525" y="149" font-size="11.5" text-anchor="middle">큐 4</text>
  <text class="ink" x="638" y="149" font-size="11.5" text-anchor="middle">큐 5</text>
  <text class="ink" x="752" y="149" font-size="11.5" text-anchor="middle">큐 6</text>

  <text class="warn"  x="276" y="174" font-size="12" font-weight="600" text-anchor="middle">×2</text>
  <text class="warn"  x="412" y="174" font-size="12" font-weight="600" text-anchor="middle">×2</text>
  <text class="warn"  x="548" y="174" font-size="12" font-weight="600" text-anchor="middle">×2</text>
  <text class="muted" x="684" y="174" font-size="12" text-anchor="middle">×1</text>

  <text class="muted" x="44" y="203" font-size="12">조각이 실은 큐</text>
  <text class="ink" x="208" y="203" font-size="13" font-weight="600" text-anchor="middle">2</text>
  <text class="ink" x="344" y="203" font-size="13" font-weight="600" text-anchor="middle">2</text>
  <text class="ink" x="480" y="203" font-size="13" font-weight="600" text-anchor="middle">2</text>
  <text class="ink" x="616" y="203" font-size="13" font-weight="600" text-anchor="middle">2</text>
  <text class="ink" x="752" y="203" font-size="13" font-weight="600" text-anchor="middle">1</text>

  <text class="ink" x="44" y="236" font-size="13" xml:space="preserve"><tspan>합계 </tspan><tspan class="bad" font-weight="600">9 큐</tspan><tspan>  ·  고유 </tspan><tspan class="good" font-weight="600">6 큐</tspan><tspan>  ·  경계 중복 </tspan><tspan class="warn" font-weight="600">3 큐</tspan></text>
  <text class="muted" x="44" y="264" font-size="12" xml:space="preserve"><tspan>큐 5 는 끝이 경계와 정확히 일치한다 — 판정이 반개구간(</tspan><tspan class="m">e &gt; lo</tspan><tspan>)이므로 다음 조각에는 실리지 않는다</tspan></text>
</svg>
