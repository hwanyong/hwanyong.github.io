<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img"
     aria-label="MPEGTS 값의 범위 검사는 한쪽에만 있다. 0 미만은 코드가 명시적으로 거부해 보정을 포기하지만, 2의 33제곱 이상인 값에는 검사가 없어 그대로 계산에 들어간다. 규격이 정한 범위는 0 부터 2의 33제곱 빼기 1 까지다.">
  <style>
    .bg     { fill:#ffffff; stroke:#d8dee6 }
    .band   { fill:#f6f8fa; stroke:#d8dee6 }
    .safe   { fill:#dafbe1; stroke:#4ac26b }
    .danger { fill:#ffebe9; stroke:#ff8182 }
    .ink    { fill:#1f2328 }
    .muted  { fill:#656d76 }
    .good   { fill:#1a7f37 }
    .bad    { fill:#cf222e }
    .gate   { stroke:#1a7f37 }
    .nogate { stroke:#cf222e }
    @media (prefers-color-scheme: dark) {
      .bg     { fill:#0d1117; stroke:#30363d }
      .band   { fill:#161b22; stroke:#30363d }
      .safe   { fill:#12341f; stroke:#3fb950 }
      .danger { fill:#3d1518; stroke:#f85149 }
      .ink    { fill:#e6edf3 }
      .muted  { fill:#8b949e }
      .good   { fill:#3fb950 }
      .bad    { fill:#f85149 }
      .gate   { stroke:#3fb950 }
      .nogate { stroke:#f85149 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="244" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">범위 검사가 한쪽에만 있다 — 하한은 막고, 상한은 열려 있다</text>
  <text class="muted" x="44" y="66" font-size="12.5">가로축은 자막 헤더에서 읽어 낸 MPEGTS 값이다. 규격이 정한 범위는 가운데 구간뿐이다.</text>

  <rect class="safe"   x="60"  y="96" width="190" height="44" rx="5" stroke-width="1.2"/>
  <rect class="band"   x="252" y="96" width="388" height="44" rx="5" stroke-width="1.2"/>
  <rect class="danger" x="642" y="96" width="178" height="44" rx="5" stroke-width="1.2"/>

  <text class="good"  x="155" y="123" font-size="12.5" text-anchor="middle" font-weight="600">값 &lt; 0</text>
  <text class="ink"   x="446" y="123" font-size="12.5" text-anchor="middle">0 … 2³³−1  (규격이 정한 범위)</text>
  <text class="bad"   x="731" y="123" font-size="12.5" text-anchor="middle" font-weight="600">값 ≥ 2³³</text>

  <line x1="251" y1="88" x2="251" y2="148" class="gate" stroke-width="3"/>
  <line x1="641" y1="88" x2="641" y2="148" class="nogate" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text class="ink m" x="251" y="170" font-size="11.5" text-anchor="middle">if mpegts &lt; 0: return None</text>
  <text class="bad"   x="641" y="170" font-size="12" text-anchor="middle" font-weight="600">검사 없음</text>

  <text class="good"  x="155" y="196" font-size="12" text-anchor="middle">명시적 거부 → 보정을 포기한다</text>
  <text class="muted" x="446" y="196" font-size="12" text-anchor="middle">통과 → 오프셋 계산</text>
  <text class="bad"   x="731" y="196" font-size="12" text-anchor="middle">통과 → 오프셋 계산</text>

  <text class="muted" x="44" y="226" font-size="12" xml:space="preserve"><tspan class="ink" font-weight="600">상한을 넘은 값도 실수 하나를 만들어 낸다.</tspan><tspan> 그 결과는 26.5시간짜리 오프셋이 되어, 걸러지는 것이 아니라 하류의</tspan></text>
  <text class="muted" x="44" y="244" font-size="12">자막 타임라인 검사에서야 FAIL 로 드러난다 — 조용하지는 않지만, 검사된 것도 아니다.</text>
</svg>
