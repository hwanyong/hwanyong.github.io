<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="CBC 복호화의 연쇄 구조. 암호문 블록 셋이 각각 AES 블록 복호를 거친 뒤 직전 암호문 블록과 XOR 되어 평문이 된다. 첫 블록에는 직전 암호문이 없으므로 그 자리에 IV 가 들어간다. 따라서 IV 가 틀리면 첫 평문 블록만 어긋나고, 반대로 암호문 한 블록을 조작하면 그 블록은 무작위가 되고 다음 블록의 같은 자리 비트가 정확히 뒤집힌다.">
  <defs>
    <marker id="c23a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="c23b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mka"/>
    </marker>
  </defs>
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .panel { fill:#f6f8fa; stroke:#d8dee6 }
    .chip  { fill:#eaeef2; stroke:#d8dee6 }
    .chipa { fill:#ddf4ff; stroke:#0969da }
    .xor   { fill:#ffffff; stroke:#0969da }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .accs  { stroke:#0969da }
    .rules { stroke:#656d76 }
    .warn  { fill:#9a6700 }
    .mk    { fill:#656d76 }
    .mka   { fill:#0969da }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .panel { fill:#161b22; stroke:#30363d }
      .chip  { fill:#21262d; stroke:#30363d }
      .chipa { fill:#123a63; stroke:#4493f8 }
      .xor   { fill:#0d1117; stroke:#4493f8 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .accs  { stroke:#4493f8 }
      .rules { stroke:#8b949e }
      .warn  { fill:#d29922 }
      .mk    { fill:#8b949e }
      .mka   { fill:#4493f8 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="16" width="840" height="348" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="46" font-size="15" font-weight="600">CBC 복호화 — 각 블록은 직전 암호문 블록과 XOR 된다</text>
  <text class="muted m" x="44" y="66" font-size="12">Pᵢ = D_K(Cᵢ) ⊕ Cᵢ₋₁ · 첫 블록의 Cᵢ₋₁ 자리에 IV 가 들어간다</text>

  <!-- 행 라벨 -->
  <text class="muted" x="44" y="122" font-size="11.5">암호문</text>
  <text class="muted" x="44" y="190" font-size="11.5">블록 복호</text>
  <text class="muted" x="44" y="302" font-size="11.5">평문</text>

  <!-- 1열 -->
  <rect class="chip" x="275" y="96" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="340" y="124" font-size="13" text-anchor="middle">C₁ (16B)</text>
  <line class="rules" x1="340" y1="140" x2="340" y2="156" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="panel" x="275" y="158" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink" x="340" y="180" font-size="12.5" text-anchor="middle">AES 블록 복호</text>
  <text class="muted m" x="340" y="195" font-size="11" text-anchor="middle">키 K (16B)</text>
  <line class="rules" x1="340" y1="202" x2="340" y2="224" stroke-width="1.3" marker-end="url(#c23a)"/>
  <circle class="xor" cx="340" cy="242" r="14" stroke-width="1.3"/>
  <text class="acc" x="340" y="247" font-size="14" text-anchor="middle" font-weight="700">⊕</text>
  <line class="rules" x1="340" y1="256" x2="340" y2="270" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="chip" x="275" y="272" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="340" y="300" font-size="13" text-anchor="middle">P₁</text>

  <!-- 2열 -->
  <rect class="chip" x="475" y="96" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="540" y="124" font-size="13" text-anchor="middle">C₂ (16B)</text>
  <line class="rules" x1="540" y1="140" x2="540" y2="156" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="panel" x="475" y="158" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink" x="540" y="180" font-size="12.5" text-anchor="middle">AES 블록 복호</text>
  <text class="muted m" x="540" y="195" font-size="11" text-anchor="middle">키 K (16B)</text>
  <line class="rules" x1="540" y1="202" x2="540" y2="224" stroke-width="1.3" marker-end="url(#c23a)"/>
  <circle class="xor" cx="540" cy="242" r="14" stroke-width="1.3"/>
  <text class="acc" x="540" y="247" font-size="14" text-anchor="middle" font-weight="700">⊕</text>
  <line class="rules" x1="540" y1="256" x2="540" y2="270" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="chip" x="475" y="272" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="540" y="300" font-size="13" text-anchor="middle">P₂</text>

  <!-- 3열 -->
  <rect class="chip" x="675" y="96" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="740" y="124" font-size="13" text-anchor="middle">C₃ (16B)</text>
  <line class="rules" x1="740" y1="140" x2="740" y2="156" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="panel" x="675" y="158" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink" x="740" y="180" font-size="12.5" text-anchor="middle">AES 블록 복호</text>
  <text class="muted m" x="740" y="195" font-size="11" text-anchor="middle">키 K (16B)</text>
  <line class="rules" x1="740" y1="202" x2="740" y2="224" stroke-width="1.3" marker-end="url(#c23a)"/>
  <circle class="xor" cx="740" cy="242" r="14" stroke-width="1.3"/>
  <text class="acc" x="740" y="247" font-size="14" text-anchor="middle" font-weight="700">⊕</text>
  <line class="rules" x1="740" y1="256" x2="740" y2="270" stroke-width="1.3" marker-end="url(#c23a)"/>
  <rect class="chip" x="675" y="272" width="130" height="44" rx="5" stroke-width="1"/>
  <text class="ink m" x="740" y="300" font-size="13" text-anchor="middle">P₃</text>

  <!-- IV 주입 -->
  <rect class="chipa" x="110" y="220" width="120" height="44" rx="5" stroke-width="1.3"/>
  <text class="acc m" x="170" y="240" font-size="13" text-anchor="middle">IV</text>
  <text class="muted" x="170" y="256" font-size="10.5" text-anchor="middle">16B · 비밀 아님</text>
  <line class="accs" x1="230" y1="242" x2="322" y2="242" stroke-width="1.5" marker-end="url(#c23b)"/>

  <!-- 사슬 -->
  <polyline class="accs" points="405,118 440,118 440,242 522,242" fill="none" stroke-width="1.5" marker-end="url(#c23b)"/>
  <text class="acc m" x="483" y="234" font-size="11.5" text-anchor="middle">C₁</text>
  <polyline class="accs" points="605,118 640,118 640,242 722,242" fill="none" stroke-width="1.5" marker-end="url(#c23b)"/>
  <text class="acc m" x="683" y="234" font-size="11.5" text-anchor="middle">C₂</text>

  <text class="muted" x="44" y="336" font-size="11.5">IV 가 틀리면 어긋나는 것은 P₁ 뿐이다 — 뒤 블록은 자기 앞 암호문만 참조한다</text>
  <text class="warn" x="44" y="354" font-size="11.5">암호문 C₂ 의 한 비트를 바꾸면 P₂ 는 무작위가 되고 P₃ 의 같은 자리 비트가 뒤집힌다 — 가단성</text>
</svg>
